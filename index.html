<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pips gård">
<meta name="theme-color" content="#a5bf66">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Pips gård</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
html, body { margin: 0; height: 100%; background: #1a2045; }
/* Pips boot scene: shared by the start page (dusk) and the loading screen (night). Only transform and opacity animate, so it keeps moving while the game script is busy. */
#boot { position: fixed; inset: 0; z-index: 9000; overflow: hidden; background: #1a2045; font-family: Fredoka, 'Trebuchet MS', system-ui, sans-serif; color: #fff6e4; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; --gh: clamp(150px, 27vh, 230px); --hz: calc(var(--gh) + clamp(60px, 13vh, 120px)); }
#boot.out { opacity: 0; transition: opacity 0.7s ease; pointer-events: none; }
#boot .sky { position: absolute; inset: 0; background: linear-gradient(#141a3c 0%, #1f2856 38%, #36396e 62%, #5a4a78 80%, #7a5a7e 100%); }
#boot .dusk { position: absolute; inset: 0; background: linear-gradient(#26306a 0%, #4a4a8a 34%, #9a6c9a 58%, #f0a080 78%, #ffd59a 100%); opacity: 0; transition: opacity 0.9s ease; }
#boot.isDusk .dusk { opacity: 1; }
#boot.isDusk.toNight .dusk { opacity: 0; }
#boot .stars { position: absolute; left: 0; right: 0; top: 0; height: 70%; }
#boot .stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff6d8; box-shadow: 0 0 6px #fff1b8; animation: bTw 3.2s ease-in-out infinite; will-change: opacity; }
#boot .stars i.b { width: 5px; height: 5px; }
#boot .stars i.s { width: 2px; height: 2px; box-shadow: none; }
#boot.isDusk .stars { opacity: 0.45; transition: opacity 0.9s ease; }
#boot.isDusk.toNight .stars { opacity: 1; }
@keyframes bTw { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
#boot .moon { position: absolute; top: 9vh; right: 9vw; width: clamp(54px, 9vh, 84px); height: clamp(54px, 9vh, 84px); border-radius: 50%; background: radial-gradient(circle at 38% 36%, #fffbea, #fbe9b6 60%, #ecd08e); box-shadow: 0 0 40px 10px rgba(255, 236, 170, 0.28), 0 0 120px 40px rgba(255, 220, 150, 0.12); }
#boot .moon::before, #boot .moon::after { content: ''; position: absolute; border-radius: 50%; background: rgba(214, 182, 120, 0.35); }
#boot .moon::before { width: 22%; height: 22%; left: 52%; top: 26%; }
#boot .moon::after { width: 14%; height: 14%; left: 30%; top: 58%; }
#boot.isDusk .moon { transform: translateY(6vh); opacity: 0.75; transition: transform 1s ease, opacity 1s ease; }
#boot.isDusk.toNight .moon { transform: none; opacity: 1; }
#boot .sun { position: absolute; left: 50%; bottom: calc(var(--hz) - 50px); width: 160px; height: 160px; margin-left: -80px; border-radius: 50%; background: radial-gradient(circle, #fff3c4, #ffd27a 45%, rgba(255, 190, 110, 0) 70%); opacity: 0; transition: opacity 0.9s ease, transform 0.9s ease; }
#boot.isDusk .sun { opacity: 0.9; }
#boot.isDusk.toNight .sun { opacity: 0; transform: translateY(60px); }
#boot .sea { position: absolute; left: 0; right: 0; bottom: 0; height: var(--hz); background: linear-gradient(#3b4a7a, #26375e 40%, #1c2b4c); }
#boot.isDusk .sea { background: linear-gradient(#8a7aa6, #4a5a8e 40%, #2a3a64); }
#boot .shim { position: absolute; height: 3px; border-radius: 3px; background: #ffe7a8; opacity: 0.5; animation: bSh 4s ease-in-out infinite; will-change: transform, opacity; }
@keyframes bSh { 0%, 100% { transform: translateX(-10px) scaleX(0.7); opacity: 0.15; } 50% { transform: translateX(10px) scaleX(1); opacity: 0.6; } }
#boot .isle { position: absolute; left: 50%; bottom: calc(var(--gh) - 34px); width: min(980px, 128vw); transform: translateX(-50%); }
#boot .isle svg { display: block; width: 100%; height: auto; }
#boot .isle .win { animation: bWin 5s ease-in-out infinite; }
@keyframes bWin { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
#boot .ground { position: absolute; left: 0; right: 0; bottom: 0; height: var(--gh); }
#boot .ground > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#boot .flies { position: absolute; inset: 0; pointer-events: none; }
#boot .flies i { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #fff2a0; box-shadow: 0 0 10px 3px rgba(255, 230, 120, 0.7); animation: bFly 7s ease-in-out infinite; will-change: transform, opacity; }
@keyframes bFly { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: 1; } 50% { transform: translate(26px, -30px); opacity: 0.6; } 80% { opacity: 1; } 100% { transform: translate(-8px, -62px); opacity: 0; } }
#boot .title { position: absolute; left: 50%; top: max(3vh, env(safe-area-inset-top, 0px)); width: min(760px, 94vw); transform: translateX(-50%); animation: bFloat 5s ease-in-out infinite; }
#boot .title svg { display: block; width: 100%; height: auto; overflow: visible; }
@keyframes bFloat { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 6px); } }
/* the lantern path */
#boot .track { position: absolute; left: 9%; right: 13%; bottom: calc(var(--gh) * 0.21); height: 0; }
#boot .lamp { position: absolute; bottom: 0; width: 26px; height: 78px; margin-left: -13px; }
#boot .lamp svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#boot .lamp .glow { position: absolute; left: 50%; top: 10px; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 226, 140, 0.75), rgba(255, 200, 110, 0.25) 40%, rgba(255, 190, 100, 0) 70%); opacity: 0; will-change: opacity; }
#boot .lamp .flame { position: absolute; left: 7px; top: 12px; width: 12px; height: 14px; border-radius: 40%; background: #ffe28a; opacity: 0; will-change: opacity; }
#boot .lamp.lit .glow, #boot .lamp.lit .flame { opacity: 1; transition: opacity 0.5s ease; transition-delay: inherit; }
#boot .walker { position: absolute; left: 0; bottom: -4px; width: 100%; height: 0; will-change: transform; }
#boot .walker .who { position: absolute; bottom: 0; }
#boot .pip { width: clamp(46px, 8.6vh, 74px); left: calc(clamp(46px, 8.6vh, 74px) / -2); }
#boot .pet { width: clamp(52px, 9.6vh, 84px); left: calc(clamp(52px, 9.6vh, 84px) * -1 - 30px); }
#boot .who svg { display: block; width: 100%; height: auto; overflow: visible; }
#boot .walk .bob { animation: bBob 0.42s ease-in-out infinite alternate; will-change: transform; }
#boot .walk .pet .bob { animation-duration: 0.3s; }
@keyframes bBob { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-7%) rotate(3deg); } }
#boot .shadow { position: absolute; left: 15%; right: 15%; bottom: -5px; height: 10px; border-radius: 50%; background: rgba(10, 18, 30, 0.35); }
#boot .walk.go { animation: bWalk 11s linear forwards; }
#boot .walk.go.petw { animation-delay: 0.25s; }
@keyframes bWalk { 0% { transform: translateX(0); } 30% { transform: translateX(40%); } 60% { transform: translateX(64%); } 100% { transform: translateX(84%); } }
#boot .end { position: absolute; right: -7%; bottom: -2px; width: clamp(56px, 10vh, 86px); }
#boot .end svg { display: block; width: 100%; height: auto; }
#boot .heart { position: absolute; left: 50%; bottom: 100%; width: 46px; margin-left: -23px; opacity: 0; transform: scale(0.3); }
#boot .heart.pop { opacity: 1; transform: translateY(-20px) scale(1); transition: transform 0.45s cubic-bezier(.3, 1.8, .5, 1), opacity 0.2s ease; }
#boot .walker.hop .bob { animation: bHop 0.5s ease-out 1; }
@keyframes bHop { 40% { transform: translateY(-30%); } }
/* start page */
#boot .picks { position: absolute; left: 0; right: 0; bottom: calc(var(--gh) * 0.1); display: flex; justify-content: center; align-items: flex-end; gap: clamp(18px, 6vw, 70px); padding: 0 16px; }
#boot .pick { display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #fff6e4; font-size: clamp(20px, 3.4vw, 30px); font-weight: 700; text-shadow: 0 3px 0 #22303c, 0 0 12px rgba(20, 20, 50, 0.6); animation: bFloat2 3.6s ease-in-out infinite; }
#boot .pick + .pick { animation-delay: -1.8s; }
#boot .pick .disc { width: clamp(118px, 21vh, 190px); height: clamp(118px, 21vh, 190px); border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fffaf0, #fff0d6 70%, #f0d9b0); border: 5px solid #22303c; box-shadow: 0 9px 0 rgba(20, 24, 50, 0.55), 0 0 0 7px rgba(255, 236, 180, 0.35), 0 0 40px rgba(255, 220, 140, 0.45); display: grid; place-items: center; transition: transform 0.12s ease, box-shadow 0.12s ease; }
#boot .pick.main .disc { width: clamp(140px, 25vh, 230px); height: clamp(140px, 25vh, 230px); }
#boot .pick .disc svg { width: 78%; height: auto; }
#boot .pick:active .disc, #boot .pick.press .disc { transform: translateY(6px) scale(0.97); box-shadow: 0 3px 0 rgba(20, 24, 50, 0.55), 0 0 0 7px rgba(255, 236, 180, 0.5), 0 0 50px rgba(255, 220, 140, 0.6); }
#boot .pick:focus-visible { outline: none; }
#boot .pick:focus-visible .disc { outline: 5px solid #fff1b8; outline-offset: 5px; }
#boot .pick .play { position: absolute; }
@keyframes bFloat2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
#boot.isStart .stand { position: absolute; left: 6%; bottom: calc(var(--gh) * 0.32); display: flex; align-items: flex-end; gap: 0; }
#boot.isStart .stand .who { position: relative; left: 0; } #boot.isStart .stand .pet { margin-right: -6px; }
#boot .wave { transform-box: fill-box; transform-origin: 20% 90%; animation: bWave 1.2s ease-in-out infinite alternate; }
@keyframes bWave { from { transform: rotate(-12deg); } to { transform: rotate(18deg); } }
#boot .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: bWave 0.5s ease-in-out infinite alternate; }
#boot.toNight .picks, #boot.toNight .stand { opacity: 0; transition: opacity 0.5s ease; }
@media (orientation: portrait) {
  #boot .picks { bottom: auto; top: 33vh; align-items: center; gap: clamp(14px, 5vw, 50px); }
  #boot .pick.main .disc { width: min(40vw, 25vh, 240px); height: min(40vw, 25vh, 240px); }
  #boot .pick .disc { width: min(30vw, 19vh, 180px); height: min(30vw, 19vh, 180px); }
  #boot .moon { top: 23vh; right: 7vw; }
}
@media (max-width: 640px) and (orientation: portrait) {
  #boot { --gh: clamp(170px, 30vh, 260px); }
  #boot .picks { top: 31vh; }
  #boot .pick { font-size: 20px; }
  #boot .pick .disc { border-width: 4px; }
  #boot.isStart .stand { left: 5%; bottom: calc(var(--gh) * 0.22); }
  #boot .isle { width: 170vw; }
  #boot .moon { top: 19vh; right: auto; left: 6vw; width: 42px; height: 42px; }
  #boot.isStart .picks { top: 34vh; }
}
@media (max-height: 520px) and (orientation: landscape) {
  #boot .title { width: min(520px, 60vw); }
  #boot .picks { bottom: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  #boot .stars i, #boot .shim, #boot .flies i, #boot .title, #boot .pick, #boot .bob, #boot .wave, #boot .tail, #boot .isle .win { animation: none !important; }
}
/* the wardrobe hides everything else on the page; the loading screen must stay on top until it fades */
html body.dressing > div#boot#boot { visibility: visible !important; }
/* start page: continue / new game */
#boot .pick .disc { position: relative; }
#boot .pick .badgeP { position: absolute; right: -4%; bottom: -2%; width: 34%; }
#boot .pick .badgeP svg, #boot .pick .ring { display: block; width: 100%; height: auto; }
#boot .pick .ring { position: absolute; inset: -9px; width: calc(100% + 18px); height: calc(100% + 18px); pointer-events: none; }
#boot .pick.hold { touch-action: none; -webkit-touch-callout: none; }
#boot .pick .ring { opacity: 0; } #boot .pick.press .ring { opacity: 1; }

/* the sandbox pick: a bit smaller, so three fit side by side on a phone */
#boot .pick.sbx .disc { width: clamp(100px, 17vh, 160px); height: clamp(100px, 17vh, 160px); background: radial-gradient(circle at 50% 35%, #fffaf0, #eaf4ff 70%, #c9def0); }
#boot .picks.three .pick + .pick + .pick { animation-delay: -0.9s; }
@media (orientation: portrait) {
  #boot .picks.three { gap: clamp(8px, 3vw, 40px); }
  #boot .picks.three .pick.main .disc { width: min(34vw, 24vh, 230px); height: min(34vw, 24vh, 230px); }
  #boot .picks.three .pick .disc { width: min(26vw, 18vh, 170px); height: min(26vw, 18vh, 170px); }
}
</style>
</head>
<body>
<div id="boot" class="isDusk isStart"></div>
<script>
/* Pips boot scene: draws the island, sky, Pip and the pet into #boot. Used by the start page and the loading screen. */
(function () {
  var INK = '#22303c';
  var AVO = {
    skin: ['#f6d3b8', '#e8b48f', '#c98b62', '#9a6440', '#6b4430'],
    hc: ['#3a2a22', '#7a4a2a', '#e0b45a', '#c4562e', '#22232a', '#d9d4cc', '#e889b5', '#6aa0e0'],
    sh: ['#e9684a', '#1f6a80', '#e0a646', '#3f7d62', '#f0907a', '#7b5ea7', '#fff6e4', '#22303c'],
    bc: ['#2e4a7a', '#7d5e4e', '#22303c', '#3f7d62', '#e889b5', '#e0a646', '#d9443a'],
    sc: ['#3a3433', '#e9684a', '#1f6a80', '#f2c14a', '#3f7d62', '#e889b5', '#fff6e4']
  };
  function readAv() {
    var a = null; try { a = JSON.parse(localStorage.getItem('pips-avatar') || 'null'); } catch (e) {}
    if (!a || typeof a !== 'object') a = {};
    var d = { skin: 1, hs: 6, hc: 1, ts: 0, sh: 0, bs: 0, bc: 0, ss: 0, sc: 0 };
    for (var k in d) if (!(a[k] >= 0)) a[k] = d[k];
    return a;
  }
  function readPet() {
    try { var s = JSON.parse(localStorage.getItem('pip-farm-care-v1') || 'null'); if (s && ['dog', 'cat', 'wolf', 'bear', 'none'].indexOf(s.pet) >= 0) return s.pet; /* 'none': no pet walks along */ } catch (e) {}
    return 'dog';
  }
  function pick(arr, i) { return arr[i] || arr[0]; }

  /* Pip, seen slightly from the side, walking to the right */
  function pipSVG(av, waving) {
    var skin = pick(AVO.skin, av.skin), hc = pick(AVO.hc, av.hc), sh = pick(AVO.sh, av.sh), bc = pick(AVO.bc, av.bc), sc = pick(AVO.sc, av.sc), hs = av.hs | 0;
    var s = '<svg viewBox="0 0 64 96" aria-hidden="true"><g stroke="' + INK + '" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">';
    /* hair that hangs behind the head */
    if (hs === 1) s += '<path d="M14 26 C12 40 14 48 19 52 H45 C50 48 52 40 50 26 Z" fill="' + hc + '"/>';
    if (hs === 2) s += '<circle cx="12" cy="30" r="6" fill="' + hc + '"/><circle cx="52" cy="30" r="6" fill="' + hc + '"/>';
    if (hs === 3) s += '<circle cx="32" cy="7" r="7" fill="' + hc + '"/>';
    if (av.ts === 2) s += '<path d="M18 40 C14 34 16 26 22 24 H42 C48 26 50 34 46 40 Z" fill="' + sh + '"/>';
    /* legs and shoes */
    if (av.bs === 1) s += '<rect x="22" y="70" width="8" height="15" rx="3" fill="' + skin + '"/><rect x="34" y="70" width="8" height="15" rx="3" fill="' + skin + '"/><path d="M19 64 H45 V75 H19 Z" fill="' + bc + '"/>';
    else if (av.bs === 2) s += '<rect x="22" y="72" width="8" height="13" rx="3" fill="' + skin + '"/><rect x="34" y="72" width="8" height="13" rx="3" fill="' + skin + '"/><path d="M20 62 H44 L48 78 H16 Z" fill="' + bc + '"/>';
    else s += '<rect x="22" y="64" width="8" height="21" rx="3" fill="' + bc + '"/><rect x="34" y="64" width="8" height="21" rx="3" fill="' + bc + '"/>';
    var boot = av.ss === 1 ? 7 : 4;
    s += '<path d="M20 ' + (87 - boot) + ' H30 V85 C33 85 35 87 35 90 H20 Z" fill="' + sc + '"/><path d="M33 ' + (87 - boot) + ' H43 V85 C46 85 48 87 48 90 H33 Z" fill="' + sc + '"/>';
    /* jacket */
    s += '<path d="M17 50 C17 44 21 41 26 41 H38 C43 41 47 44 47 50 V69 C47 71 46 72 44 72 H20 C18 72 17 71 17 69 Z" fill="' + sh + '"/>';
    if (av.ts === 1) s += '<path d="M18 52 H46 M18 59 H46 M18 66 H46" stroke="#fff6e4" stroke-width="3" opacity="0.7"/><path d="M17 50 C17 44 21 41 26 41 H38 C43 41 47 44 47 50 V69 C47 71 46 72 44 72 H20 C18 72 17 71 17 69 Z" fill="none"/>';
    else s += '<path d="M32 43 V71" stroke-width="2"/>';
    /* arms */
    s += '<path d="M18 47 C13 52 12 58 14 63" fill="none" stroke="' + INK + '" stroke-width="8"/><path d="M18 47 C13 52 12 58 14 63" fill="none" stroke="' + sh + '" stroke-width="4"/><circle cx="14" cy="65" r="3.6" fill="' + skin + '"/>';
    if (waving) s += '<g class="wave"><path d="M46 47 C52 42 54 36 54 30" fill="none" stroke="' + INK + '" stroke-width="8"/><path d="M46 47 C52 42 54 36 54 30" fill="none" stroke="' + sh + '" stroke-width="4"/><circle cx="54" cy="27" r="3.8" fill="' + skin + '"/></g>';
    else s += '<path d="M46 47 C51 52 52 58 50 63" fill="none" stroke="' + INK + '" stroke-width="8"/><path d="M46 47 C51 52 52 58 50 63" fill="none" stroke="' + sh + '" stroke-width="4"/><circle cx="50" cy="65" r="3.6" fill="' + skin + '"/>';
    /* head */
    s += '<circle cx="32" cy="25" r="17" fill="' + skin + '"/>';
    s += '<ellipse cx="25" cy="31" rx="3.4" ry="2.2" fill="#f2a08e" stroke="none" opacity="0.8"/><ellipse cx="41" cy="31" rx="3.4" ry="2.2" fill="#f2a08e" stroke="none" opacity="0.8"/>';
    s += '<circle cx="27" cy="26" r="2.2" fill="' + INK + '" stroke="none"/><circle cx="38" cy="26" r="2.2" fill="' + INK + '" stroke="none"/><path d="M29 33 Q32.5 36 36 33" fill="none" stroke-width="2.2"/>';
    /* hair or hat on top */
    if (hs === 6) s += '<path d="M16 24 C15 15 22 12 32 12 C42 12 49 15 48 24 C44 19 38 18 32 18 C26 18 20 19 16 24 Z" fill="' + hc + '"/><path d="M15 18 C15 2 49 2 49 18 Z" fill="#e0a646"/><rect x="14" y="14" width="36" height="7" rx="3.5" fill="#f2c14a"/><circle cx="32" cy="2" r="4.5" fill="#fff6e4"/>';
    else if (hs === 5) s += '<path d="M15 22 C15 7 49 7 49 22 Z" fill="' + sh + '"/><path d="M45 20 H59 C59 23 56 24 52 24 H45 Z" fill="' + sh + '"/><path d="M15 22 H49" />';
    else if (hs === 4) s += '<g fill="' + hc + '"><circle cx="18" cy="19" r="6"/><circle cx="25" cy="12" r="6.5"/><circle cx="33" cy="10" r="6.5"/><circle cx="41" cy="13" r="6.5"/><circle cx="47" cy="20" r="5.5"/></g>';
    else s += '<path d="M15 26 C12 6 52 6 49 26 C46 16 39 14 32 14 C25 14 18 17 15 26 Z" fill="' + hc + '"/>';
    return s + '</g></svg>';
  }

  /* the pet, walking to the right (or sitting on the start page) */
  var PETS = {
    dog: { c: '#e0a24a', d: '#b8772e', ear: 'flop', tail: 'up', collar: '#d9443a', muz: '#f2cf94' },
    cat: { c: '#f0a25a', d: '#c47a36', ear: 'point', tail: 'curl', collar: '#1f6a80', muz: '#fbe3c4' },
    wolf: { c: '#9aa2ae', d: '#6e7684', ear: 'point', tail: 'bush', collar: '#3f7d62', muz: '#eef0f2' },
    bear: { c: '#9a6440', d: '#6e4428', ear: 'round', tail: 'stub', collar: '#e0a646', muz: '#d8b088' }
  };
  function petSVG(kind) {
    var p = PETS[kind] || PETS.dog;
    var s = '<svg viewBox="0 0 80 58" aria-hidden="true"><g stroke="' + INK + '" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">';
    if (p.tail === 'up') s += '<path class="tail" d="M16 30 C8 26 6 18 9 12" fill="none" stroke="' + INK + '" stroke-width="8"/><path class="tail" d="M16 30 C8 26 6 18 9 12" fill="none" stroke="' + p.c + '" stroke-width="4"/>';
    if (p.tail === 'curl') s += '<path class="tail" d="M16 30 C4 28 4 12 12 10" fill="none" stroke="' + INK + '" stroke-width="7"/><path class="tail" d="M16 30 C4 28 4 12 12 10" fill="none" stroke="' + p.c + '" stroke-width="3.4"/>';
    if (p.tail === 'bush') s += '<path class="tail" d="M18 30 C6 32 2 24 4 18 C10 22 14 22 18 24 Z" fill="' + p.c + '"/>';
    if (p.tail === 'stub') s += '<circle cx="15" cy="30" r="4" fill="' + p.c + '"/>';
    s += '<rect x="20" y="38" width="7" height="15" rx="3" fill="' + p.d + '"/><rect x="46" y="38" width="7" height="15" rx="3" fill="' + p.d + '"/>';
    s += '<ellipse cx="36" cy="34" rx="22" ry="12" fill="' + p.c + '"/>';
    s += '<rect x="26" y="38" width="7" height="15" rx="3" fill="' + p.c + '"/><rect x="52" y="38" width="7" height="15" rx="3" fill="' + p.c + '"/>';
    /* head */
    var hx = 60, hy = 20;
    if (p.ear === 'point') s += '<path d="M' + (hx - 10) + ' ' + (hy - 6) + ' L' + (hx - 8) + ' ' + (hy - 20) + ' L' + (hx - 1) + ' ' + (hy - 10) + ' Z" fill="' + p.c + '"/><path d="M' + (hx + 3) + ' ' + (hy - 10) + ' L' + (hx + 9) + ' ' + (hy - 20) + ' L' + (hx + 12) + ' ' + (hy - 5) + ' Z" fill="' + p.c + '"/>';

  function rnd(seed) { return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

  }

})();

(function () {
  var FARM = '<svg viewBox="0 0 120 100" aria-hidden="true"><path d="M14 86 V44 L40 26 L66 44 V86 Z" fill="#e9684a" stroke="#22303c" stroke-width="4" stroke-linejoin="round"/><path d="M8 48 L40 22 L72 48" fill="none" stroke="#fff6e4" stroke-width="5" stroke-linecap="round"/><rect x="30" y="58" width="20" height="28" fill="#22303c"/><path d="M30 58 L50 86 M50 58 L30 86" stroke="#fff6e4" stroke-width="3"/><ellipse cx="92" cy="70" rx="20" ry="15" fill="#f4b0a2" stroke="#22303c" stroke-width="3.5"/><ellipse cx="104" cy="72" rx="7" ry="5" fill="#e88f80" stroke="#22303c" stroke-width="3"/><circle cx="96" cy="64" r="2.5" fill="#22303c"/><path d="M84 56 l4 -9 l6 7" fill="#f4b0a2" stroke="#22303c" stroke-width="3" stroke-linejoin="round"/><path d="M80 84 v6 M100 84 v6" stroke="#22303c" stroke-width="4" stroke-linecap="round"/><path d="M88 22 C76 12 82 2 88 8 C94 2 100 12 88 22 Z" fill="#e9684a" stroke="#22303c" stroke-width="3" stroke-linejoin="round"/></svg>';
  var el = document.getElementById('boot'), me = PipsScene.build(el, 'start');
  var v = ''; try { v = localStorage.getItem('pipsVer') || ''; } catch (e) {}
  var q = v ? '?v=' + encodeURIComponent(v) : '';
  var KEY = 'pip-farm-care-v1', has = false;
  try { var sv = JSON.parse(localStorage.getItem(KEY) || 'null'); has = !!(sv && sv.v === 1); } catch (e) {}
  var PLAY = '<span class="badgeP"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#74a857" stroke="#22303c" stroke-width="4"/><path d="M19 14 L35 24 L19 34 Z" fill="#fff6e4" stroke="#22303c" stroke-width="3.5" stroke-linejoin="round"/></svg></span>';
  var SPROUT = '<svg viewBox="0 0 120 100" aria-hidden="true"><g stroke="#22303c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M22 84 C30 66 90 66 98 84 Z" fill="#8a6a4e"/><path d="M60 72 V40" fill="none"/><path d="M60 52 C42 50 32 34 36 22 C50 24 60 36 60 52 Z" fill="#74a857"/><path d="M60 44 C74 38 88 22 84 10 C70 12 60 26 60 44 Z" fill="#8fc46a"/></g><g fill="#f2c14a" stroke="#22303c" stroke-width="2.5" stroke-linejoin="round"><path d="M96 34 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"/><path d="M24 30 l2.5 5.5 l5.5 2.5 l-5.5 2.5 l-2.5 5.5 l-2.5 -5.5 l-5.5 -2.5 l5.5 -2.5 z"/></g></svg>';
  /* the sandbox: a rainbow over a pig, a cow and a hen, the whole farm there to play with */
  var RAINBOW = '<svg viewBox="0 0 120 100" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-width="7"><path d="M14 66 A46 46 0 0 1 106 66" stroke="#e9684a"/><path d="M21 66 A39 39 0 0 1 99 66" stroke="#f2c14a"/><path d="M28 66 A32 32 0 0 1 92 66" stroke="#74a857"/><path d="M35 66 A25 25 0 0 1 85 66" stroke="#5a9fc4"/></g>'
    + '<g stroke="#22303c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">'
    + '<path d="M44 60 L40 50 L50 55 Z M76 60 L80 50 L70 55 Z" fill="#f6b8c8"/><ellipse cx="60" cy="72" rx="20" ry="17" fill="#f6b8c8"/><ellipse cx="60" cy="78" rx="9" ry="6.5" fill="#f19aae"/>'
    + '<path d="M14 64 L8 58 M30 64 L36 58" /><ellipse cx="22" cy="76" rx="14" ry="13" fill="#fffaf0"/><path d="M14 70 Q18 64 24 68 Q22 74 16 74 Z" fill="#3a2e2a"/><ellipse cx="22" cy="84" rx="9" ry="5.5" fill="#f3c7a6"/>'
    + '<path d="M95 61 Q98 54 102 60 Q106 55 106 63" fill="#e9684a"/><circle cx="98" cy="76" r="13" fill="#fffaf0"/><path d="M108 75 L117 78 L108 81 Z" fill="#f2c14a"/></g>'
    + '<g fill="#22303c"><circle cx="53" cy="68" r="2.4"/><circle cx="67" cy="68" r="2.4"/><circle cx="57" cy="78" r="1.8"/><circle cx="63" cy="78" r="1.8"/><circle cx="18" cy="76" r="2.2"/><circle cx="27" cy="76" r="2.2"/><circle cx="101" cy="73" r="2.2"/></g>'
    + '<g fill="#f2c14a" stroke="#22303c" stroke-width="2.5" stroke-linejoin="round"><path d="M60 6 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"/></g></svg>';
  var RING = '<svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#e9684a" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 999" transform="rotate(-90 50 50)"/></svg>';
  var picks = has
    ? '<a class="pick main" data-go="go" href="bondgard.html' + q + '" aria-label="Fortsätt spela"><span class="disc">' + FARM + PLAY + '</span>Fortsätt</a>'

  /* the sandbox has its own save, so it never touches the farm above */
  picks += '<a class="pick sbx" data-go="go" href="bondgard.html?sandbox=1' + (v ? '&v=' + encodeURIComponent(v) : '') + '" aria-label="Sandlåda: allt är redan köpt"><span class="disc">' + RAINBOW + '</span>Sandlåda</a>';
  el.insertAdjacentHTML('beforeend', '<div class="stand">' + (me.pet === 'none' ? '' : '<div class="who pet" style="width:clamp(60px,11vh,96px)">' + PipsScene.petSVG(me.pet) + '</div>') + '<div class="who pip" style="width:clamp(54px,10vh,86px)">' + PipsScene.pipSVG(me.av, true) + '</div></div><nav class="picks three">' + picks + '</nav>');
  var going = false;
  function go(a) {
    if (going) return; going = true;
    if (a.dataset.go === 'new') { try { localStorage.removeItem(KEY); localStorage.removeItem('pips-delivery'); } catch (e) {} }
    a.classList.add('press'); el.classList.add('toNight');
    setTimeout(function () { location.href = a.href; }, 750);
  }
  el.querySelectorAll('.pick').forEach(function (a) {
    if (!a.classList.contains('hold')) { a.addEventListener('click', function (e) { e.preventDefault(); go(a); }); return; }
    /* starting over wipes the farm, so it needs a 2 second hold while a ring fills */
    var arc = a.querySelector('.ring circle'), L = 2 * Math.PI * 46, t0 = 0, raf = 0;
    var draw = function (f) { arc.setAttribute('stroke-dasharray', (f * L).toFixed(1) + ' 999'); };
    var tick = function () { if (!t0) return; var f = Math.min(1, (performance.now() - t0) / 2000); draw(f); if (f >= 1) { t0 = 0; go(a); return; } raf = requestAnimationFrame(tick); };
    var stop = function () { if (going) return; cancelAnimationFrame(raf); t0 = 0; draw(0); a.classList.remove('press'); };
    a.addEventListener('click', function (e) { e.preventDefault(); });
    a.addEventListener('pointerdown', function (e) { e.preventDefault(); if (going) return; a.classList.add('press'); t0 = performance.now(); raf = requestAnimationFrame(tick); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { a.addEventListener(ev, stop); });
    a.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(a); } });

  window.addEventListener('pageshow', function (e) { if (e.persisted) { going = false; el.classList.remove('toNight'); el.querySelectorAll('.press').forEach(function (a) { a.classList.remove('press'); }); } });
})();
