<!doctype html>

<title>Pips gård</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root { color-scheme: light; --paper: #fff6e4; --ink: #22303c; --accent: #e9684a; --grass: #a5bf66; }
html, body { margin: 0; height: 100%; }
body { background: radial-gradient(circle at 50% 30%, #c4d98a, var(--grass) 60%, #86ad5c); font-family: Fredoka, 'Trebuchet MS', system-ui, sans-serif; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
main { display: flex; gap: clamp(16px, 4vw, 40px); flex-wrap: wrap; justify-content: center; }
a.pick { display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(42vw, 300px); min-width: 150px; padding: 18px 14px 14px; border-radius: 32px; border: 4px solid var(--ink); background: var(--paper); box-shadow: 0 8px 0 rgba(34,48,60,0.3); text-decoration: none; color: inherit; font-size: clamp(22px, 4vw, 32px); font-weight: 700; }
a.pick:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(34,48,60,0.3); }
a.pick:focus-visible { outline: 4px solid #1f6a80; outline-offset: 4px; }
a.pick svg { width: 100%; height: auto; }
@media (orientation: portrait) and (max-width: 500px) { main { flex-direction: column; align-items: center; } a.pick { width: min(70vw, 280px); } }
</style>
</head>
<body>
<main>
  <a class="pick" href="butik.html" aria-label="Butiken: sälj ägg och äpplen">
    <svg viewBox="0 0 120 100" aria-hidden="true"><path d="M16 40 H104 V86 H16 Z" fill="#7d5e4e" stroke="#22303c" stroke-width="4" stroke-linejoin="round"/><path d="M10 40 L20 18 H100 L110 40 Z" fill="#fff6e4" stroke="#22303c" stroke-width="4" stroke-linejoin="round"/><path d="M30 18 L26 40 M50 18 L48 40 M70 18 L72 40 M90 18 L94 40" stroke="#e9684a" stroke-width="8"/><path d="M10 40 L20 18 H100 L110 40 Z" fill="none" stroke="#22303c" stroke-width="4" stroke-linejoin="round"/><rect x="12" y="38" width="96" height="10" fill="#ecd3a0" stroke="#22303c" stroke-width="4"/><ellipse cx="40" cy="62" rx="8" ry="10" fill="#fffbf4" stroke="#22303c" stroke-width="3"/><circle cx="62" cy="64" r="9" fill="#e9684a" stroke="#22303c" stroke-width="3"/><circle cx="84" cy="64" r="9" fill="#e0a646" stroke="#22303c" stroke-width="3"/></svg>
    Butik
  </a>
  <a class="pick" href="bondgard.html" aria-label="Bondgården: mata djuren">
    <svg viewBox="0 0 120 100" aria-hidden="true"><path d="M14 86 V44 L40 26 L66 44 V86 Z" fill="#e9684a" stroke="#22303c" stroke-width="4" stroke-linejoin="round"/><path d="M8 48 L40 22 L72 48" fill="none" stroke="#fff6e4" stroke-width="5" stroke-linecap="round"/><rect x="30" y="58" width="20" height="28" fill="#22303c"/><path d="M30 58 L50 86 M50 58 L30 86" stroke="#fff6e4" stroke-width="3"/><ellipse cx="92" cy="70" rx="20" ry="15" fill="#f4b0a2" stroke="#22303c" stroke-width="3.5"/><ellipse cx="104" cy="72" rx="7" ry="5" fill="#e88f80" stroke="#22303c" stroke-width="3"/><circle cx="96" cy="64" r="2.5" fill="#22303c"/><path d="M84 56 l4 -9 l6 7" fill="#f4b0a2" stroke="#22303c" stroke-width="3" stroke-linejoin="round"/><path d="M80 84 v6 M100 84 v6" stroke="#22303c" stroke-width="4" stroke-linecap="round"/><path d="M88 22 C76 12 82 2 88 8 C94 2 100 12 88 22 Z" fill="#e9684a" stroke="#22303c" stroke-width="3" stroke-linejoin="round"/></svg>
    Bondgård
  </a>
</main>
<script>try{var v=localStorage.getItem("pipsVer");if(v)document.querySelectorAll("a.pick").forEach(function(a){a.href=a.getAttribute("href").split("?")[0]+"?v="+encodeURIComponent(v);});}catch(e){}</script>
</body>
</html>
