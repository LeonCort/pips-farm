<style>
:root { color-scheme: light; --paper: #fff6e4; --ink: #22303c; --ochre: #e0a646; --accent: #e9684a; --sea: #1f6a80; --line: #e2d2b4; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #f8dcc0; color: var(--ink); font-family: Fredoka, 'Trebuchet MS', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--sea); outline-offset: 3px; }
.scene { position: fixed; inset: 0; touch-action: none; }
.scene canvas { width: 100%; height: 100%; display: block; }
.vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(34,48,60,0) 60%, rgba(34,48,60,0.2) 100%); }
.coins { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 8px; padding: 6px 18px 6px 8px; border-radius: 999px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 4px 0 rgba(34,48,60,0.25); pointer-events: none; }
.coins svg { width: 40px; height: 40px; }
.coins span { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 1.5ch; }
.coins span.bump { animation: bump 0.25s ease-out; }
@keyframes bump { 50% { transform: scale(1.18); } }
.menuBtn { position: fixed; top: max(10px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--ink); background: var(--accent); box-shadow: 0 5px 0 rgba(34,48,60,0.3); padding: 10px; }
.menuBtn svg { width: 100%; height: 100%; display: block; }
.menuBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(34,48,60,0.3); }
.hint { position: fixed; left: 50%; bottom: max(70px, 12vh); width: 96px; height: 96px; margin-left: -48px; pointer-events: none; animation: tap 1.4s ease-in-out infinite; }
.hint svg { width: 100%; height: 100%; overflow: visible; }
.hint .ripple { transform-origin: 26px 18px; animation: ripple 1.4s ease-out infinite; }
@keyframes tap { 0%, 100% { transform: translate(0, 0); } 40% { transform: translate(-18px, -10px); } 70% { transform: translate(14px, -4px); } }
@keyframes ripple { 0% { opacity: 0.9; transform: scale(0.4); } 100% { opacity: 0; transform: scale(1.6); } }
.menu { position: fixed; inset: 0; background: rgba(34,48,60,0.35); display: flex; align-items: flex-end; justify-content: center; }
.menu[hidden] { display: none; }
.sheet { width: min(560px, 100%); box-sizing: border-box; background: var(--paper); border: 3px solid var(--ink); border-bottom: 0; border-radius: 28px 28px 0 0; padding: 14px max(16px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-bottom, 0px)); animation: up 0.22s ease-out; }
@keyframes up { from { transform: translateY(40%); opacity: 0; } }
.sheetTop { display: flex; justify-content: space-between; margin-bottom: 12px; }
.round { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--ink); background: #fffaf0; padding: 6px; }
.round svg { width: 100%; height: 100%; display: block; }
.round .mute { display: none; }
.round.off .mute { display: inline; } .round.off .wave { display: none; }
.ups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.up { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px 10px; border-radius: 22px; border: 3px solid var(--ink); background: #fffaf0; box-shadow: 0 5px 0 rgba(34,48,60,0.25); }
.up:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(34,48,60,0.25); }
.up svg { width: 72px; height: 72px; }
.dots { display: flex; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); border: 1.5px solid #cdb894; }
.dots i.on { background: #74a857; border-color: #3f7d62; }
.price { display: flex; align-items: center; gap: 6px; font-size: 24px; font-weight: 700; padding: 2px 14px; border-radius: 999px; background: var(--ochre); border: 2px solid var(--ink); }
.price i { width: 18px; height: 18px; border-radius: 50%; background: var(--ochre); border: 2px solid var(--ink); }
.up { position: relative; }
/* can buy: green price and a little wiggle so the child sees "press me" */
.up.can { background: #f2fae6; border-color: #3f7d62; }
.up.can .price { background: #74a857; color: #fff6e4; }
.up.can svg { animation: wiggle 1.6s ease-in-out infinite; }
@keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-8deg) scale(1.06); } 86% { transform: rotate(8deg) scale(1.06); } 94% { transform: rotate(-4deg); } }
/* cannot buy yet: grey, with a bar that fills as coins come in */
.up.poor svg { filter: grayscale(0.8); opacity: 0.6; }
.up.poor .price { background: var(--line); color: #7d6e5e; }
.need { display: none; width: 80%; height: 10px; border-radius: 999px; background: var(--line); border: 2px solid #cdb894; overflow: hidden; }
.need b { display: block; height: 100%; width: 0; background: var(--ochre); transition: width 0.3s; }
.up.poor .need { display: block; }
.up.maxed .price { background: #74a857; color: #fff6e4; }
.up.maxed .price i { display: none; }
.up.shake { animation: shake 0.4s; }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.up.got { animation: got 0.45s ease-out; }

.dots i.pop { animation: got 0.45s ease-out; }
.coins.no { animation: shake 0.4s; background: #f7c9bb; }

.menuBtn .badge { position: absolute; top: -6px; right: -6px; width: 30px; height: 30px; border-radius: 50%; background: #74a857; border: 3px solid var(--ink); color: #fff6e4; font: 700 22px/24px Fredoka, sans-serif; text-align: center; display: none; }
.menuBtn.ready .badge { display: block; }
.menuBtn.ready { animation: ready 1.4s ease-in-out infinite; }
@keyframes ready { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
@media (prefers-reduced-motion: reduce) { .up.can svg, .menuBtn.ready, .up.shake, .up.got, .coins.no { animation: none; } }
.flycoin { position: fixed; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--ochre); border: 3px solid var(--ink); pointer-events: none; transition: transform 0.6s cubic-bezier(.5,-0.3,.7,1), opacity 0.6s ease-in; z-index: 5; }
.nogl { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 20px; }
@media (prefers-reduced-motion: reduce) { .hint, .hint .ripple { animation: none; } .sheet { animation: none; } }
.homeBtn { display: block; box-sizing: border-box; }
.sheetTop { gap: 12px; } .sheetTop .homeBtn { margin-right: auto; }
.ctrlBtn .tapI { display: none; } .ctrlBtn.tap .tapI { display: block; } .ctrlBtn.tap .drag { display: none; }
.joy { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 4px solid rgba(255,246,228,0.85); background: rgba(34,48,60,0.12); pointer-events: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(255,246,228,0.95); border: 3px solid var(--ink); }
[hidden] { display: none !important; }
.updBtn { position: relative; }
.updBtn .chk, .updBtn .bad { display: none; }
.updBtn.ok .arr, .updBtn.bad .arr { display: none; } .updBtn.ok .chk { display: inline; } .updBtn.bad .bad { display: inline; }
.updBtn.ok { background: #e3f4e0; border-color: #2f7d4f; } .updBtn.new { background: #e3f4e0; border-color: #2f7d4f; }
.updBtn.busy .arr, .updBtn.new .arr { transform-origin: 24px 24px; animation: updSpin 0.9s linear infinite; }
.updBtn .dot { display: none; position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid var(--ink); }
.updBtn.has .dot { display: block; } .updBtn.ok .dot { display: none; }
@keyframes updSpin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .updBtn.busy .arr, .updBtn.new .arr { animation-duration: 2.5s; } }
.ward { background: transparent; }
.ward .sheet { animation: none; padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.wardRows { display: flex; flex-direction: column; gap: 8px; }
.wrow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.sw { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--ink); background: #fffaf0; padding: 4px; display: grid; place-items: center; }
.sw i { display: block; width: 100%; height: 100%; border-radius: 50%; }
.sw svg { width: 100%; height: 100%; display: block; }
.sw.on { box-shadow: 0 0 0 4px var(--paper), 0 0 0 7px #2f7d4f; transform: scale(1.08); }
.sw:active { transform: scale(0.94); }
.wardDone { align-self: center; width: 84px; height: 64px; border-radius: 32px; border: 3px solid var(--ink); background: #3f9a62; box-shadow: 0 5px 0 rgba(34,48,60,0.3); padding: 8px; }
.wardDone svg { width: 100%; height: 100%; display: block; }
.wardDone:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(34,48,60,0.3); }
@media (orientation: landscape) { .ward { align-items: center; justify-content: flex-end; padding-right: max(16px, env(safe-area-inset-right, 0px)); } .sw { width: 46px; height: 46px; } .ward .sheet { width: min(480px, 54vw); border: 3px solid var(--ink); border-radius: 28px; margin-top: 60px; } }
@media (max-width: 480px) { .sw { width: 38px; height: 38px; padding: 3px; } .wrow { gap: 6px; } }
@media (max-height: 520px) { .sw { width: 31px; height: 31px; padding: 2px; border-width: 2px; } .wrow { gap: 5px; } .wardRows { gap: 4px; } .ward .sheet { margin-top: 0; max-height: none; padding-top: 8px; gap: 6px; } .wardDone { height: 48px; width: 72px; } }
.toast { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 10px 26px 10px 14px; border-radius: 999px; background: var(--paper); border: 4px solid var(--ink); box-shadow: 0 6px 0 rgba(34,48,60,0.3); font-size: 34px; pointer-events: none; }
.toast svg { width: 56px; height: 56px; }
.toast b { font-weight: 700; margin-right: 8px; }
.toast.show { animation: toastIn 3.2s ease-out forwards; }
@keyframes toastIn { 0% { opacity: 0; transform: translateX(-50%) scale(0.6); } 10% { opacity: 1; transform: translateX(-50%) scale(1.06); } 16% { transform: translateX(-50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast.show { animation: none; } }
.ups[hidden], .round[hidden] { display: none; }
.fpsBtn { position: relative; }
.fpsBtn b { position: absolute; left: 0; right: 0; bottom: 5px; font: 800 15px/1 system-ui, sans-serif; color: var(--ink); text-align: center; }
.fpsBtn.eco .leaf { stroke: #2f7d4f; transform: rotate(-50deg); transform-origin: 24px 30px; }
/* ---------- settings: a side panel on the right, one row per setting (icon + name), the game stays visible beside it ---------- */
#menu { z-index: 150; background: rgba(34,48,60,0.18); justify-content: flex-end; align-items: stretch; }
#menu .sheet { position: relative; width: min(320px, 86vw); height: 100%; max-height: 100%; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  border: 3px solid var(--ink); border-right: 0; border-radius: 26px 0 0 26px; box-shadow: -8px 0 24px rgba(34,48,60,0.22);
  padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) 16px; animation: pipsSide 0.22s ease-out; }
@keyframes pipsSide { from { transform: translateX(100%); } to { transform: translateX(0); } }
#menu .sheetTop { flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 8px; margin-bottom: 14px; }
#menu .sheetTop::before { content: 'Inställningar'; order: -10; display: block; height: 56px; line-height: 56px; font-size: 24px; font-weight: 700; padding-right: 64px; }
#menu #menuClose { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 52px; height: 52px; padding: 8px; }

/* the name sits to the right of the round button and is part of it, so the whole row can be tapped */
#menu .sheetTop > .round::after { content: attr(aria-label); position: absolute; left: calc(100% + 14px); top: 50%; transform: translateY(-50%); width: min(200px, calc(86vw - 120px)); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 18px; font-weight: 600; color: var(--ink); line-height: 54px; }
#menu .sheetTop > a.round { display: block; box-sizing: border-box; text-decoration: none; }
#menu .fpsBtn b { bottom: 3px; font-size: 13px; }

/* order and groups: play, picture, help, start over */
#menu #soundBtn { order: 1; } #menu #wardBtn { order: 2; } #menu #ctrlBtn { order: 3; }
#menu #fpsBtn { order: 10; } #menu #gfxBtn { order: 11; } #menu #drawBtn { order: 12; } #menu #fxQBtn { order: 13; } #menu #grassBtn { order: 14; } #menu #sunBtn { order: 15; }
#menu #updBtn { order: 20; } #menu #logBtn { order: 21; } #menu #homeBtn { order: 22; } #menu #devBtn { order: 23; }

#menu #fpsBtn, #menu #updBtn, #menu #logBtn:first-child, #menu #restartBtn { margin-top: 14px; }
#menu #fpsBtn::before, #menu #updBtn::before, #menu #restartBtn::before { content: ''; position: absolute; left: 0; top: -12px; width: min(270px, calc(86vw - 40px)); border-top: 2px dashed var(--line); }
#menu #updBtn[hidden] + #logBtn { margin-top: 14px; }
#menu .sheetTop > #soundBtn::after { content: 'Ljud'; } #menu .sheetTop > #wardBtn::after { content: 'Kläder och hår'; } #menu .sheetTop > #ctrlBtn::after { content: 'Styrning'; }
#menu .sheetTop > #fpsBtn::after { content: 'Bilder per sekund'; } #menu .sheetTop > #gfxBtn::after { content: 'Grafik: lätt / full / ultra'; } #menu .sheetTop > #drawBtn::after { content: 'Hur långt man ser'; } #menu .sheetTop > #fxQBtn::after { content: 'Ljuseffekter'; }
#menu .sheetTop > #updBtn::after { content: 'Sök uppdatering'; } #menu .sheetTop > #logBtn::after { content: 'Kopiera loggen'; } #menu .sheetTop > #logBtn.ok::after { content: 'Kopierad!'; color: #2f7d4f; }
#menu .sheetTop > #homeBtn::after { content: 'Välj spel'; } #menu .sheetTop > #devBtn::after { content: 'Utvecklarläge'; } #menu .sheetTop > #restartBtn::after { content: 'Börja om (håll inne)'; color: #b8401f; }
#menu #menuClose::after { content: none; }
#menu .sheetTop > #devBtn.on::after { content: 'Utvecklarläge: på'; }
#menu .ups { grid-template-columns: 1fr 1fr; gap: 10px; }
#menu .ups .up svg { width: 56px; height: 56px; }
.logBtn .chk { display: none; } .logBtn.ok .chk { display: inline; } .logBtn.ok .clip { display: none; } .logBtn.ok { background: #e3f4e0; border-color: #2f7d4f; }

@media (max-height: 560px) {
  #menu .sheetTop { gap: 5px; } #menu .sheetTop::before { height: 44px; line-height: 44px; font-size: 20px; }

}

/* the log, shown as text when the browser will not copy it by itself */

.flycoin { background: var(--accent); }
.price i { background: var(--accent); border-radius: 50% 50% 50% 50%; }
.acts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(18px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 14px; align-items: flex-end; }

.albumBtn { position: fixed; top: max(14px, env(safe-area-inset-top, 0px)); right: calc(max(16px, env(safe-area-inset-right, 0px)) + 90px); width: 68px; height: 68px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); box-shadow: 0 5px 0 rgba(34,48,60,0.3); padding: 8px; }

@media (max-width: 480px) { .stk { width: 70px; } .stk img, .stk span { width: 60px; height: 60px; } .albumBtn { width: 60px; height: 60px; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 86px); } }
@media (prefers-reduced-motion: reduce) { .albumBtn.new { animation: none; } }

<script>
/* ---------- the game log: errors, warnings, frame stalls and recent events, for troubleshooting ----------
   Runs as its own <script> before everything else, so it still works when the game script fails.
   The log is kept in localStorage, so after a freeze and a reload the previous session is still there.
   The settings panel has a button that copies both sessions as plain text, to paste into a chat. */
(function () {
  'use strict';
  var KEY = 'pips-log', MAX = 300, PREV_MAX = 300;
  var page = (location.pathname.split('/').pop() || 'index.html');
  var seq = 0, started = Date.now(), closing = false, errs = {}, buf = [], prev = null, dirty = true, frames = 0, lastTick = 0, loopDead = false, lastErr = '';
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function clock(t) { var d = new Date(t || Date.now()); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function day(t) { var d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + clock(t); }
  function add(kind, msg) {
    msg = String(msg == null ? '' : msg).replace(/\s+/g, ' ').slice(0, 500);
    if (kind === 'ERROR') { var c = errs[msg] = (errs[msg] || 0) + 1; if (c > 3) { if (c === 4) add('info', 'the error above keeps coming; counted at the top from now on'); return; } }
    var last = buf[buf.length - 1];
    if (last && last.k === kind && last.m === msg) { last.n = (last.n || 1) + 1; last.e = clock(); last.s = ++seq; }
    else { buf.push({ t: clock(), k: kind, m: msg, s: ++seq, boot: Date.now() - started < 20000 ? 1 : undefined }); if (buf.length > MAX) buf.splice(0, buf.length - MAX); }
    dirty = true;
    if (kind === 'ERROR') store();
    if (kind === 'ERROR' || (kind === 'STALL' && Date.now() - started >= 20000)) soon(kind === 'ERROR' ? 'error' : 'stall');
  }
  /* the previous session, read before this one starts writing */
  try { prev = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { prev = null; }
  function store() {
    if (!dirty) return; dirty = false;
    try { localStorage.setItem(KEY, JSON.stringify({ page: page, start: started, beat: Date.now(), closed: closing, ver: ver(), lines: buf, prev: prevSummary() })); } catch (e) {}
  }
  /* one older session is kept, so a freeze is still in the log after one more reload */
  function prevSummary() { return prev && prev.lines ? { page: prev.page, start: prev.start, beat: prev.beat, closed: prev.closed, ver: prev.ver, lines: prev.lines.slice(-PREV_MAX) } : null; }
  function ver() { var m = document.querySelector('meta[name="app-ver"]'); return m ? m.content : '?'; }

  /* errors */
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.src || t.href)) { add('ERROR', 'could not load ' + (t.src || t.href)); return; }
    var where = e.filename ? ' @ ' + String(e.filename).split('/').pop().slice(0, 40) + ':' + e.lineno + ':' + e.colno : '';
    var st = e.error && e.error.stack ? ' | ' + String(e.error.stack).split('\n').slice(1, 4).map(function (s) { return s.trim(); }).join(' < ') : '';
    add('ERROR', (e.message || 'error') + where + st);
  }, true);
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; add('ERROR', 'promise: ' + (r && (r.stack || r.message) || r)); });
  ['error', 'warn'].forEach(function (lv) {
    var f = console[lv]; if (!f) return;
    console[lv] = function () { try { add(lv === 'error' ? 'ERROR' : 'warn', Array.prototype.map.call(arguments, function (a) { return a && a.stack ? a.stack : typeof a === 'object' ? safe(a) : String(a); }).join(' ')); } catch (x) {} return f.apply(console, arguments); };
  });
  function safe(o) { try { return JSON.stringify(o).slice(0, 200); } catch (e) { return String(o); } }

  /* the page around the game */
  document.addEventListener('visibilitychange', function () { add('page', document.hidden ? 'hidden (app in background)' : 'visible again'); skip = true; store(); });
  window.addEventListener('pagehide', function () { closing = true; add('page', 'closed'); store(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) { closing = false; add('page', 'back from the page cache'); } });
  var rsT = 0; window.addEventListener('resize', function () { clearTimeout(rsT); rsT = setTimeout(function () { add('page', 'size ' + innerWidth + 'x' + innerHeight); }, 400); });
  window.addEventListener('online', function () { add('page', 'online'); });
  window.addEventListener('offline', function () { add('page', 'offline'); });
  /* taps on buttons, so the log shows what the player did just before something went wrong */
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button,a,[role="button"]') : null; if (!b) return;
    add('tap', b.id || b.getAttribute('aria-label') || b.className || b.tagName);
  }, true);

  /* stalls: a watcher of its own, so a stopped game loop shows up too */
  var skip = false, lastRaf = 0, stalls = 0, worst = 0;
  function watch(now) {
    if (lastRaf && !document.hidden) {
      var gap = now - lastRaf;
      if (skip) skip = false; else if (gap > 400) { stalls++; worst = Math.max(worst, gap); add('STALL', 'screen stood still for ' + (gap / 1000).toFixed(1) + ' s'); }
      if (lastTick && !loopDead && now - lastTick > 2500) { loopDead = true; add('STALL', 'the game loop stopped running (last frame ' + ((now - lastTick) / 1000).toFixed(1) + ' s ago)' + (lastErr ? ', last error: ' + lastErr : '')); store(); }
    }
    lastRaf = now; requestAnimationFrame(watch);
  }
  requestAnimationFrame(watch);
  
  /* the game reports in: tick() every frame, probe() for numbers every 30 s, gl(canvas) for the 3D context */
  var api = {
    add: add,
    tick: function () { frames++; var n = performance.now(); if (loopDead) { loopDead = false; add('info', 'the game loop runs again'); } lastTick = n; },
    caught: function (e) { var m = (e && e.message) || String(e); var w = e && e.stack ? ' | ' + String(e.stack).split('\n').slice(0, 3).map(function (s) { return s.trim(); }).join(' < ') : ''; lastErr = m; add('ERROR', 'in a frame: ' + m + w); },
    probe: null,
    gl: function (cv) {
      if (!cv || cv.__pipsLog) return; cv.__pipsLog = 1;
      cv.addEventListener('webglcontextlost', function () { add('ERROR', '3D graphics context lost (the device took the graphics memory back)'); store(); });
      cv.addEventListener('webglcontextrestored', function () { add('info', '3D graphics context restored'); });
    },
    text: text
  };
  window.PipsLog = api;
  var fT = performance.now();
  setInterval(function () {
    var now = performance.now(), fps = frames / ((now - fT) / 1000); frames = 0; fT = now;
    var p = ''; try { p = api.probe ? api.probe() : ''; } catch (e) { p = 'probe failed: ' + e.message; }
    var mem = performance.memory ? ', heap ' + Math.round(performance.memory.usedJSHeapSize / 1048576) + ' MB' : '';
    if (!document.hidden) add('stats', 'fps ' + fps.toFixed(0) + (p ? ', ' + p : '') + mem);
  }, 30000);
  /* ---------- automatic sending: batches of the log go to the pips-log receiver (a tiny Vercel project, see logserver/) ----------
     Nothing shows on screen. Sent: an anonymous random device id, the game version, the device type and the log lines.
     When: only when something went wrong. About a minute after an error (3 min after a stall), checked again every
     10 minutes and when the app goes to the background, and once at start for a previous session that did not close
     normally (its last 60 lines). A session where nothing goes wrong sends nothing.
     Off on localhost/file pages, with ?nolog in the address, or with localStorage 'pips-log-send' = 'off'. */
  var SEND_URL = 'https://pips-log-leoncorts-projects.vercel.app/api/log', SEND_MAX = 40, BODY_MAX = 60000;
  var sendOn = location.protocol === 'https:' && !/^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname) && !/[?&]nolog\b/.test(location.search);
  var devId = '', sentSeq = 0, sends = 0, sendT = 0, sendR = '', lastSend = 0;
  try {
    if (localStorage.getItem('pips-log-send') === 'off') sendOn = false;
    devId = localStorage.getItem('pips-log-id') || '';
    if (!devId) { devId = Math.random().toString(36).slice(2, 10); localStorage.setItem('pips-log-id', devId); }
  } catch (e) { devId = devId || 'nostore'; }
  function devLine() {
    var gfx = ''; try { gfx = 'gfx ' + localStorage.getItem('pips-gfx') + ' (' + localStorage.getItem('pips-gfx-by') + ')'; } catch (e) {}
    return navigator.userAgent + ' | screen ' + screen.width + 'x' + screen.height + ' @' + (window.devicePixelRatio || 1) + ', window ' + innerWidth + 'x' + innerHeight + ', ' + gfx + ', cores ' + (navigator.hardwareConcurrency || '?') + (navigator.deviceMemory ? ', memory ' + navigator.deviceMemory + ' GB' : '');
  }
  function post(reason, txt, beacon, pg, vr) {
    var body = JSON.stringify({ id: devId, page: pg || page, ver: vr || ver(), reason: reason, host: location.hostname, dev: devLine(), text: txt.length > BODY_MAX ? txt.slice(0, 2000) + '\n... (cut) ...\n' + txt.slice(-(BODY_MAX - 2100)) : txt });
    try {
      if (beacon && navigator.sendBeacon && navigator.sendBeacon(SEND_URL, new Blob([body], { type: 'text/plain' }))) return;
      fetch(SEND_URL, { method: 'POST', body: body, headers: { 'Content-Type': 'text/plain' }, keepalive: body.length < 64000, mode: 'cors', credentials: 'omit' }).catch(function () {});
    } catch (e) {}
  }
  function flush(reason, beacon) {
    clearTimeout(sendT); sendT = 0;
    if (!sendOn || sends >= SEND_MAX) return false;
    var L = keep(buf, sentSeq); if (!L) return false;
    sentSeq = seq; sends++; lastSend = Date.now();
    var head = 'session started ' + day(started) + ', batch ' + sends + ', ' + stalls + ' stalls' + (worst ? ' (worst ' + (worst / 1000).toFixed(1) + ' s)' : '') + (loopDead ? ', GAME LOOP STOPPED' : '') + (sends >= SEND_MAX ? ', LAST BATCH (limit reached)' : '') + '\n'
      + Object.keys(errs).filter(function (m) { return errs[m] > 1; }).map(function (m) { return 'Repeated error x' + errs[m] + ': ' + m.slice(0, 200) + '\n'; }).join('');
    post(reason, head + lines(L), beacon);
    return true;
  }
  /* only what is needed: nothing is sent unless there is a new error, warning or stall; then those lines go out
     with the 15 lines just before each one (what the player did, the last stats), and the rest is left out.
     Stalls in the first 20 s (loading, shaders being built) do not count. */
  var BAD = { ERROR: 1, STALL: 1, warn: 1 }, LEAD = 15;
  function keep(B, after) {
    var pick = {}, any = false;
    B.forEach(function (l, i) {
      if (l.s > after && BAD[l.k] && !(l.k === 'STALL' && l.boot)) { any = true; for (var j = Math.max(0, i - LEAD); j <= i; j++) pick[j] = 1; }
    });
    if (!any) return null;
    var out = [], gap = false;
    B.forEach(function (l, i) { if (pick[i]) { if (gap && out.length) out.push({ t: '', k: '...', m: '' }); out.push(l); gap = false; } else gap = true; });
    return out;
  }
  /* errors and stalls: wait a bit so one bad moment goes out as one batch; errors at most one batch a minute, stalls every 3 minutes */
  function soon(reason) {
    if (!sendOn || (sendT && (sendR === 'error' || reason !== 'error'))) return;
    clearTimeout(sendT); sendR = reason;
    var gap = reason === 'error' ? 60000 : 180000;
    sendT = setTimeout(function () { sendT = 0; flush(reason); }, Math.max(20000, gap - (Date.now() - lastSend)));
  }
  setInterval(function () { if (!document.hidden) flush('periodic'); }, 600000);
  document.addEventListener('visibilitychange', function () { if (document.hidden) flush('close', true); });
  window.addEventListener('pagehide', function () { flush('close', true); });
  /* the previous session froze or crashed: send its last lines once */
  if (sendOn && prev && prev.lines && !prev.closed) {
    var rep = ''; try { rep = localStorage.getItem('pips-log-reported') || ''; } catch (e) {}
    if (rep !== String(prev.start)) {
      try { localStorage.setItem('pips-log-reported', String(prev.start)); } catch (e) {}
      var tail = { page: prev.page, start: prev.start, beat: prev.beat, closed: false, ver: prev.ver, lines: prev.lines.slice(-60) };
      setTimeout(function () { post('crash', 'previous session did NOT close normally, its last ' + tail.lines.length + ' lines:' + session('Previous session', tail), false, prev.page, prev.ver); }, 8000);
    }
  }
  api.send = flush;
  setInterval(function () { dirty = true; store(); }, 3000);
  add('info', 'start ' + page);

  function lines(L) { return (L || []).map(function (l) { return l.t + (l.n > 1 ? '-' + l.e + ' x' + l.n : '') + ' ' + l.k + ' ' + l.m; }).join('\n'); }
  function session(title, s) {
    if (!s || !s.lines) return '';
    var end = s.closed ? 'closed normally' : 'did NOT close normally (freeze, crash, or the app was killed); last sign of life ' + day(s.beat);
    return '\n== ' + title + ': ' + (s.page || '?') + ' v' + (s.ver || '?') + ', started ' + day(s.start) + ', ' + end + ' ==\n' + lines(s.lines) + '\n';
  }
  function text() {
    store();
    var gfx = ''; try { gfx = 'gfx ' + localStorage.getItem('pips-gfx') + ' (' + localStorage.getItem('pips-gfx-by') + ')'; } catch (e) {}
    var head = 'Pips log, copied ' + day(Date.now()) + '\n'
      + 'Auto-send: ' + (sendOn ? 'on, device ' + devId + ', ' + sends + ' batches sent this session' : 'off') + '\n'
      + 'Device: ' + navigator.userAgent + '\n'
      + 'Screen ' + screen.width + 'x' + screen.height + ' @' + (window.devicePixelRatio || 1) + ', window ' + innerWidth + 'x' + innerHeight + ', ' + gfx + ', cores ' + (navigator.hardwareConcurrency || '?') + (navigator.deviceMemory ? ', memory ' + navigator.deviceMemory + ' GB' : '') + '\n'
      + 'This session: ' + stalls + ' stalls' + (worst ? ' (worst ' + (worst / 1000).toFixed(1) + ' s)' : '') + (loopDead ? ', GAME LOOP STOPPED' : '') + '\n'
      + Object.keys(errs).filter(function (m) { return errs[m] > 1; }).map(function (m) { return 'Repeated error x' + errs[m] + ': ' + m.slice(0, 200) + '\n'; }).join('');
    var older = prev && prev.prev ? prev.prev : null;
    return head + session('This session', { page: page, start: started, beat: Date.now(), closed: true, ver: ver(), lines: buf }).replace('closed normally', 'running now')
      + session('Previous session', prev) + session('Session before that', older);
  }

  /* the copy button in the settings panel */
  function copy(t, done) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0';
      document.body.appendChild(ta); ta.focus(); ta.select(); try { ta.setSelectionRange(0, t.length); } catch (e) {}
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); if (ok) done(true); else show(t, done);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { done(true); }, fallback);
    else fallback();
  }
  /* when the browser will not copy: show the text, selected, with its own copy and close buttons */
  function show(t, done) {
    var w = document.createElement('div'); w.className = 'logView';
    w.innerHTML = '<div class="logBox"><textarea readonly></textarea><div class="logRow"><button type="button" data-c>Kopiera</button><button type="button" data-x>Stäng</button></div></div>';
    var ta = w.querySelector('textarea'); ta.value = t; document.body.appendChild(w);
    ['pointerdown', 'touchstart', 'mousedown', 'wheel', 'keydown'].forEach(function (ev) { w.addEventListener(ev, function (e) { e.stopPropagation(); }, { passive: true }); });
    setTimeout(function () { ta.focus(); ta.select(); }, 50);
    w.querySelector('[data-c]').addEventListener('click', function () { ta.focus(); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} if (ok) { done(true); w.remove(); } });
    w.querySelector('[data-x]').addEventListener('click', function () { w.remove(); done(false); });
  }
  function button() {
    var top = document.querySelector('#menu .sheetTop'); if (!top || document.getElementById('logBtn')) return;
    var b = document.createElement('button'); b.type = 'button'; b.className = 'round logBtn'; b.id = 'logBtn'; b.setAttribute('aria-label', 'Kopiera loggen');
    b.innerHTML = '<svg viewBox="0 0 48 48" aria-hidden="true"><g class="clip"><rect x="10" y="9" width="28" height="33" rx="4" fill="#fff6e4" stroke="#22303c" stroke-width="3"/><rect x="17" y="5" width="14" height="8" rx="3" fill="#e9684a" stroke="#22303c" stroke-width="3"/><path d="M16 21 h16 M16 27 h16 M16 33 h10" stroke="#22303c" stroke-width="3" stroke-linecap="round"/></g><path class="chk" d="M12 25 L21 34 L37 15" fill="none" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var up = document.getElementById('updBtn'); top.insertBefore(b, up ? up.nextSibling : document.getElementById('menuClose'));
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      copy(text(), function (ok) {
        if (!ok) return; b.classList.add('ok'); add('info', 'log copied');
        setTimeout(function () { b.classList.remove('ok'); }, 2500);
      });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', button); else button();
})();
</script>
<style>
/* Pips boot scene: shared by the start page (dusk) and the loading screen (night). Only transform and opacity animate, so it keeps moving while the game script is busy. */
#boot { position: fixed; inset: 0; z-index: 9000; overflow: hidden; background: #1a2045; font-family: Fredoka, 'Trebuchet MS', system-ui, sans-serif; color: #fff6e4; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; --gh: clamp(150px, 27vh, 230px); --hz: calc(var(--gh) + clamp(60px, 13vh, 120px)); }
#boot.out { opacity: 0; transition: opacity 0.7s ease; pointer-events: none; }
#boot .sky { position: absolute; inset: 0; background: linear-gradient(#141a3c 0%, #1f2856 38%, #36396e 62%, #5a4a78 80%, #7a5a7e 100%); }
#boot .dusk { position: absolute; inset: 0; background: linear-gradient(#26306a 0%, #4a4a8a 34%, #9a6c9a 58%, #f0a080 78%, #ffd59a 100%); opacity: 0; transition: opacity 0.9s ease; }
#boot.isDusk .dusk { opacity: 1; }
#boot.isDusk.toNight .dusk { opacity: 0; }
#boot .stars { position: absolute; left: 0; right: 0; top: 0; height: 70%; }
#boot .stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff6d8; box-shadow: 0 0 6px #fff1b8; animation: bTw 3.2s ease-in-out infinite; will-change: opacity; }
#boot .stars i.b { width: 5px; height: 5px; }
#boot .stars i.s { width: 2px; height: 2px; box-shadow: none; }
#boot.isDusk .stars { opacity: 0.45; transition: opacity 0.9s ease; }
#boot.isDusk.toNight .stars { opacity: 1; }
@keyframes bTw { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
#boot .moon { position: absolute; top: 9vh; right: 9vw; width: clamp(54px, 9vh, 84px); height: clamp(54px, 9vh, 84px); border-radius: 50%; background: radial-gradient(circle at 38% 36%, #fffbea, #fbe9b6 60%, #ecd08e); box-shadow: 0 0 40px 10px rgba(255, 236, 170, 0.28), 0 0 120px 40px rgba(255, 220, 150, 0.12); }
#boot .moon::before, #boot .moon::after { content: ''; position: absolute; border-radius: 50%; background: rgba(214, 182, 120, 0.35); }
#boot .moon::before { width: 22%; height: 22%; left: 52%; top: 26%; }
#boot .moon::after { width: 14%; height: 14%; left: 30%; top: 58%; }
#boot.isDusk .moon { transform: translateY(6vh); opacity: 0.75; transition: transform 1s ease, opacity 1s ease; }
#boot.isDusk.toNight .moon { transform: none; opacity: 1; }
#boot .sun { position: absolute; left: 50%; bottom: calc(var(--hz) - 50px); width: 160px; height: 160px; margin-left: -80px; border-radius: 50%; background: radial-gradient(circle, #fff3c4, #ffd27a 45%, rgba(255, 190, 110, 0) 70%); opacity: 0; transition: opacity 0.9s ease, transform 0.9s ease; }
#boot.isDusk .sun { opacity: 0.9; }
#boot.isDusk.toNight .sun { opacity: 0; transform: translateY(60px); }
#boot .sea { position: absolute; left: 0; right: 0; bottom: 0; height: var(--hz); background: linear-gradient(#3b4a7a, #26375e 40%, #1c2b4c); }
#boot.isDusk .sea { background: linear-gradient(#8a7aa6, #4a5a8e 40%, #2a3a64); }
#boot .shim { position: absolute; height: 3px; border-radius: 3px; background: #ffe7a8; opacity: 0.5; animation: bSh 4s ease-in-out infinite; will-change: transform, opacity; }
@keyframes bSh { 0%, 100% { transform: translateX(-10px) scaleX(0.7); opacity: 0.15; } 50% { transform: translateX(10px) scaleX(1); opacity: 0.6; } }
#boot .isle { position: absolute; left: 50%; bottom: calc(var(--gh) - 34px); width: min(980px, 128vw); transform: translateX(-50%); }
#boot .isle svg { display: block; width: 100%; height: auto; }
#boot .isle .win { animation: bWin 5s ease-in-out infinite; }
@keyframes bWin { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
#boot .ground { position: absolute; left: 0; right: 0; bottom: 0; height: var(--gh); }
#boot .ground > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#boot .flies { position: absolute; inset: 0; pointer-events: none; }

    comp.connect(master); master.connect(o.dest || ctx.destination);
    const bus = {};
    for (const [name, g] of Object.entries({ sfx: VO ? 0.7 : 0.85, amb: 0.5, music: 0.45 })) { bus[name] = ctx.createGain(); bus[name].gain.value = g; bus[name].connect(comp); }

    // generated room reverb: decaying stereo noise, darker toward the tail
    const verb = ctx.createConvolver();
    {
      const secs = 1.6, n = Math.floor(secs * ctx.sampleRate), ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const r = rand('verb' + c), d = ir.getChannelData(c); let lp = 0;

      }
      verb.buffer = ir;
    }
    const verbIn = ctx.createGain(); verbIn.gain.value = 0.9; verbIn.connect(verb); verb.connect(comp);

    // seeded noise buffers: white, pink-ish and brown
    const noiseBuf = {};
    {
      const n = Math.floor(2.5 * ctx.sampleRate);
      for (const kind of ['white', 'pink', 'brown']) {
        const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), r = rand('noise-' + kind);
        let p0 = 0, p1 = 0, p2 = 0, br = 0;
        for (let i = 0; i < n; i++) {
          const w = r() * 2 - 1;
          if (kind === 'white') d[i] = w;
          else if (kind === 'pink') { p0 = 0.997 * p0 + 0.029 * w; p1 = 0.985 * p1 + 0.032 * w; p2 = 0.95 * p2 + 0.048 * w; d[i] = (p0 + p1 + p2 + w * 0.05) * 2.2; }
          else { br = (br + 0.02 * w) / 1.02; d[i] = br * 3.2; }
        }
        noiseBuf[kind] = b;
      }
    }

    // ---- automation helpers
    // a value or [[dt, value], ...] from the voice start; ramps are exponential (frequencies)
    function sweep(param, v, t) {
      if (!Array.isArray(v)) { param.setValueAtTime(v, t); return; }
      param.setValueAtTime(v[0][1], t + v[0][0]);
      for (let i = 1; i < v.length; i++) param.exponentialRampToValueAtTime(Math.max(v[i][1], 1), t + v[i][0]);
    }
    // amplitude: linear attack to `gain`, optional hold, exponential release to silence by `dur`
    function shape(param, t, gain, dur, a, hold) {
      a = Math.min(a == null ? 0.004 : a, dur * 0.9);
      hold = Math.min(hold || 0, dur - a);
      param.setValueAtTime(0, t);
      param.linearRampToValueAtTime(gain, t + a);
      if (hold > 0) param.setValueAtTime(gain, t + a + hold);
      param.exponentialRampToValueAtTime(TINY, t + dur);
      param.setValueAtTime(0, t + dur + 0.001);
    }
    function out(node, p) {
      const pan = ctx.createStereoPanner(); pan.pan.value = Math.max(-1, Math.min(1, p.pan || 0));
      node.connect(pan); pan.connect(bus[p.bus || 'sfx']);
      if (p.verb) { const s = ctx.createGain(); s.gain.value = p.verb; pan.connect(s); s.connect(verbIn); }

    function filterNode(p, t) {
      if (!p.filter) return null;

      sweep(f.frequency, p.f == null ? 1000 : p.f, t);

    }

    // Live playback from the middle of a piece: a long sound (a bed, a pad) that began before that point has a start
    // time in the past, which Web Audio refuses. Pick it up now, at its held level, for the time it has left.
    function late(t, dur, p) {
      if (t >= ctx.currentTime) return null;   // never true in an offline render, so rendered sound is unchanged
      const now = ctx.currentTime + 0.01;
      const cut = now - t, left = dur - cut;
      if (left < 0.08) return { skip: true };

    }

    // ---- primitives
    // tone(t, { f, type, dur, gain, a, hold, pan, verb, bus, filter, f2 (filter freq), q, detune })
    function tone(time, p) {
      let t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const lt = late(t, dur, p); if (lt) { if (lt.skip) return; t = lt.t; dur = lt.dur; p = lt.p; }
      const osc = ctx.createOscillator(); osc.type = p.type || 'sine';
      sweep(osc.frequency, Array.isArray(p.f) ? p.f.map(([d, v]) => [d, hz(v)]) : hz(p.f || 440), t);
      if (p.detune) osc.detune.value = p.detune;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      let node = osc;
      if (p.filter) { const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 0.8 : p.q; sweep(f.frequency, p.f2 || 2000, t); osc.connect(f); node = f; }
      node.connect(g); out(g, p);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
    // noise(t, { dur, color, filter, f, q, gain, a, hold, pan, verb, bus, rate })
    function noise(time, p) {
      let t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const lt = late(t, dur, p); if (lt) { if (lt.skip) return; t = lt.t; dur = lt.dur; p = lt.p; }
      const src = ctx.createBufferSource(); src.buffer = noiseBuf[p.color || 'white']; src.loop = true;
      if (p.rate) src.playbackRate.value = p.rate;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      const f = filterNode(p, t);
      if (f) { src.connect(f); f.connect(g); } else src.connect(g);
      out(g, p);
      const off = rand('off' + time + (p.f || ''))() * 2;
      src.start(t, off); src.stop(t + dur + 0.02);
    }

    // ---- named sounds. play(name, t, opts): opts.gain scales the whole sound, opts.pan places it.
    const S = {
      // UI / motion graphics
      pop: (t, o) => { tone(t, { f: [[0, o.f || 620], [0.07, (o.f || 620) * 0.45]], dur: 0.1, gain: 0.32 * o.g, pan: o.pan }); noise(t, { dur: 0.012, filter: 'highpass', f: 3000, gain: 0.12 * o.g, pan: o.pan }); },
      tick: (t, o) => noise(t, { dur: 0.018, filter: 'bandpass', f: o.f || 4200, q: 2.5, gain: 0.3 * o.g, pan: o.pan }),
      click: (t, o) => { tone(t, { f: o.f || 1900, type: 'square', dur: 0.02, gain: 0.08 * o.g, filter: 'lowpass', f2: 3000, pan: o.pan }); noise(t, { dur: 0.01, filter: 'highpass', f: 2500, gain: 0.15 * o.g, pan: o.pan }); },
      tock: (t, o) => { tone(t, { f: o.f || 820, dur: 0.07, gain: 0.25 * o.g, pan: o.pan }); noise(t, { dur: 0.05, filter: 'bandpass', f: o.f || 820, q: 9, gain: 0.35 * o.g, pan: o.pan }); },
      blip: (t, o) => tone(t, { f: o.f || 'E6', type: o.type || 'square', dur: o.dur || 0.07, gain: 0.07 * o.g, a: 0.002, hold: (o.dur || 0.07) * 0.6, pan: o.pan }),
      whoosh: (t, o) => { const d = o.dur || 0.45; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 350], [d * 0.55, o.top || 2600], [d, 700]], q: 0.9, gain: 0.32 * o.g, a: d * 0.5, pan: o.pan, verb: 0.15 }); },
      swish: (t, o) => { const d = o.dur || 0.18; noise(t, { dur: d, filter: 'highpass', f: [[0, 1800], [d, 5200]], q: 0.7, gain: 0.22 * o.g, a: d * 0.35, pan: o.pan }); },
      riser: (t, o) => { const d = o.dur || 0.8; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 300], [d, 4000]], q: 1.2, gain: 0.25 * o.g, a: d * 0.95, pan: o.pan, verb: 0.2 }); tone(t, { f: [[0, 180], [d, 720]], type: 'triangle', dur: d, gain: 0.06 * o.g, a: d * 0.9 }); },
      thud: (t, o) => { tone(t, { f: [[0, o.f || 130], [0.16, 42]], dur: 0.26, gain: 0.55 * o.g, pan: o.pan }); noise(t, { dur: 0.09, color: 'brown', filter: 'lowpass', f: 500, gain: 0.35 * o.g, pan: o.pan }); },
      impact: (t, o) => { S.thud(t, o); noise(t, { dur: 0.7, color: 'pink', filter: 'lowpass', f: [[0, 2400], [0.6, 300]], gain: 0.3 * o.g, verb: 0.35, pan: o.pan }); },
      stamp: (t, o) => { S.thud(t, { ...o, f: 160 }); noise(t, { dur: 0.05, filter: 'bandpass', f: 1300, q: 1.2, gain: 0.4 * o.g, pan: o.pan }); noise(t + 0.004, { dur: 0.012, filter: 'highpass', f: 3500, gain: 0.25 * o.g, pan: o.pan }); },
      ding: (t, o) => { const f = hz(o.f || 'E6'); tone(t, { f, dur: 1.3, gain: 0.2 * o.g, verb: 0.3, pan: o.pan }); tone(t, { f: f * 2.76, dur: 0.5, gain: 0.05 * o.g, verb: 0.3, pan: o.pan }); },
      success: (t, o) => { S.ding(t, { ...o, f: o.f || 'C6' }); S.ding(t + 0.09, { ...o, f: hz(o.f || 'C6') * 1.5, g: o.g * 0.9 }); },
      error: (t, o) => { tone(t, { f: o.f || 'A3', type: 'square', dur: 0.13, gain: 0.09 * o.g, hold: 0.08, filter: 'lowpass', f2: 1400, pan: o.pan }); tone(t + 0.15, { f: hz(o.f || 'A3') * 0.8, type: 'square', dur: 0.22, gain: 0.09 * o.g, hold: 0.14, filter: 'lowpass', f2: 1200, pan: o.pan }); },
      buzz: (t, o) => { const d = o.dur || 0.3; tone(t, { f: o.f || 110, type: 'sawtooth', dur: d, gain: 0.12 * o.g, hold: d * 0.7, filter: 'lowpass', f2: 900, pan: o.pan }); tone(t, { f: (o.f || 110) * 1.01, type: 'sawtooth', dur: d, gain: 0.1 * o.g, hold: d * 0.7, filter: 'lowpass', f2: 900, pan: o.pan }); },
      sparkle: (t, o) => { const r = rand('sparkle' + t), notes = ['C6', 'D6', 'E6', 'G6', 'A6', 'C7']; for (let i = 0; i < (o.n || 6); i++) { const ti = t + i * 0.04 + r() * 0.01, f = hz(notes[Math.floor(r() * notes.length)]), pan = r() * 1.2 - 0.6; tone(ti, { f, dur: 0.6, gain: 0.04 * o.g, a: 0.002, verb: 0.35, pan }); tone(ti, { f: f * 2.76, dur: 0.2, gain: 0.012 * o.g, a: 0.002, pan }); } },
      glitch: (t, o) => { const r = rand('glitch' + t); for (let i = 0; i < 7; i++) tone(t + i * 0.022, { f: 200 + r() * 1800, type: 'square', dur: 0.02, gain: 0.07 * o.g, a: 0.001, hold: 0.015, pan: r() * 1.4 - 0.7 }); noise(t, { dur: 0.16, filter: 'bandpass', f: 2500, q: 0.6, gain: 0.12 * o.g }); },
      shutter: (t, o) => { S.click(t, o); noise(t + 0.06, { dur: 0.04, filter: 'bandpass', f: 2200, q: 1, gain: 0.2 * o.g, pan: o.pan }); },
      count: (t, o) => S.tick(t, { ...o, f: o.f || 5200, g: o.g * 0.7 }),

      // hand-made media
      // stroke: a pen/marker/chalk/pencil stroke over `dur` seconds. material sets the surface sound.
      stroke: (t, o) => {
        const d = o.dur || 0.4, m = o.material || 'marker', r = rand('stroke' + m + t);

          marker: { f: 2900, q: 2.2, g: 0.16, grain: 0.05 },
          chalk: { f: 1700, q: 0.6, g: 0.22, grain: 0.028 },
          pencil: { f: 4600, q: 0.8, g: 0.16, grain: 0.04, filter: 'highpass' },
          pen: { f: 4200, q: 1.6, g: 0.08, grain: 0.06 },
          brush: { f: 900, q: 0.5, g: 0.1, grain: 0.09, color: 'pink' },
          sharpie: { f: 2400, q: 1.4, g: 0.2, grain: 0.045 },
        }[m];
        for (let x = 0; x < d; x += M.grain * (0.7 + r() * 0.6)) {
          const gd = M.grain * (0.8 + r() * 0.9);
          noise(t + x, { dur: gd, color: M.color, filter: M.filter || 'bandpass', f: M.f * (0.8 + r() * 0.4), q: M.q, gain: M.g * o.g * (0.6 + r() * 0.5), a: gd * 0.3, pan: (o.pan || 0) + (r() - 0.5) * 0.2 });
        }
      },
      // paper: picking up / slapping down / turning a sheet
      paper: (t, o) => { const d = o.dur || 0.35, r = rand('paper' + t); for (let x = 0; x < d; x += 0.025 + r() * 0.03) noise(t + x, { dur: 0.05, filter: 'bandpass', f: 1200 + r() * 2600, q: 0.9, gain: 0.12 * o.g * (1 - x / d * 0.5), pan: o.pan }); },
      slap: (t, o) => { noise(t, { dur: 0.07, filter: 'highpass', f: 900, gain: 0.45 * o.g, a: 0.001, pan: o.pan }); tone(t, { f: [[0, 180], [0.06, 70]], dur: 0.1, gain: 0.25 * o.g, pan: o.pan }); },
      tape: (t, o) => { noise(t, { dur: o.dur || 0.5, filter: 'bandpass', f: [[0, 900], [o.dur || 0.5, 2200]], q: 1.8, gain: 0.18 * o.g, a: 0.02, pan: o.pan }); },
      press: (t, o) => { S.thud(t, { ...o, f: 95, g: o.g * 0.9 }); noise(t + 0.01, { dur: 0.25, color: 'brown', filter: 'lowpass', f: 700, gain: 0.25 * o.g, pan: o.pan }); },
      roller: (t, o) => { const d = o.dur || 0.6; noise(t, { dur: d, color: 'brown', filter: 'bandpass', f: 380, q: 1.5, gain: 0.3 * o.g, a: 0.05, hold: d * 0.6, pan: o.pan }); for (let x = 0; x < d; x += 0.07) S.tock(t + x, { f: 300, g: o.g * 0.15, pan: o.pan }); },
      erase: (t, o) => { const d = o.dur || 0.6, r = rand('erase' + t); for (let x = 0; x < d; x += 0.06 + r() * 0.04) noise(t + x, { dur: 0.08, color: 'pink', filter: 'bandpass', f: 700 + r() * 500, q: 0.8, gain: 0.22 * o.g, a: 0.03, pan: (r() - 0.5) * 0.5 }); },

      // machines and screens
      key: (t, o) => { const r = rand('key' + t); noise(t, { dur: 0.025, filter: 'bandpass', f: 2600 + r() * 1200, q: 2, gain: 0.25 * o.g, a: 0.001, pan: o.pan }); tone(t, { f: 160 + r() * 40, dur: 0.04, gain: 0.12 * o.g, pan: o.pan }); },
      typing: (t, o) => { const r = rand('typing' + t), n = o.n || 8, rate = o.rate || 0.09; for (let i = 0; i < n; i++) S.key(t + i * rate * (0.75 + r() * 0.5), { g: o.g * (0.7 + r() * 0.4), pan: o.pan }); },
      typebar: (t, o) => { S.key(t, o); noise(t + 0.008, { dur: 0.03, filter: 'bandpass', f: 1100, q: 4, gain: 0.35 * o.g, pan: o.pan }); },
      bell: (t, o) => S.ding(t, { ...o, f: o.f || 'A6' }),
      boot: (t, o) => { tone(t, { f: [[0, 80], [0.35, 1600]], type: 'sine', dur: 0.5, gain: 0.08 * o.g, a: 0.3 }); S.blip(t + 0.45, { ...o, f: 'C6', dur: 0.12 }); },
      crtOn: (t, o) => { noise(t, { dur: 0.25, filter: 'highpass', f: 2000, gain: 0.2 * o.g, a: 0.001 }); tone(t, { f: 15700, dur: 1.5, gain: 0.02 * o.g, a: 0.1, hold: 1 }); S.thud(t, { ...o, f: 90, g: o.g * 0.5 }); },
      neon: (t, o) => { const d = o.dur || 0.25, r = rand('neon' + t); for (let x = 0; x < d; x += 0.035 + r() * 0.04) tone(t + x, { f: 120, type: 'sawtooth', dur: 0.03, gain: 0.3 * o.g * (0.5 + r() * 0.5), filter: 'bandpass', f2: 1200, q: 1.2, pan: o.pan }); },
      // chip (8-bit console) sounds: raw square/triangle, no filtering
      coin: (t, o) => { tone(t, { f: 'B5', type: 'square', dur: 0.07, gain: 0.07 * o.g, a: 0.001, hold: 0.06 }); tone(t + 0.07, { f: 'E6', type: 'square', dur: 0.3, gain: 0.07 * o.g, a: 0.001, hold: 0.1 }); },
      jump: (t, o) => tone(t, { f: [[0, 260], [0.16, 820]], type: 'square', dur: 0.18, gain: 0.07 * o.g, a: 0.001, hold: 0.12 }),
      hurt: (t, o) => { tone(t, { f: [[0, 600], [0.25, 90]], type: 'square', dur: 0.28, gain: 0.08 * o.g, a: 0.001, hold: 0.2 }); noise(t, { dur: 0.2, filter: 'lowpass', f: 1800, gain: 0.15 * o.g, rate: 0.25 }); },
      powerup: (t, o) => ['C5', 'E5', 'G5', 'C6', 'E6', 'G6', 'C7'].forEach((n, i) => tone(t + i * 0.045, { f: n, type: 'square', dur: 0.06, gain: 0.06 * o.g, a: 0.001, hold: 0.05 })),
      select: (t, o) => { S.blip(t, { ...o, f: 'A5', dur: 0.04 }); S.blip(t + 0.05, { ...o, f: 'E6', dur: 0.05 }); },
      text: (t, o) => { const n = o.n || 10, rate = o.rate || 0.05; for (let i = 0; i < n; i++) tone(t + i * rate, { f: i % 2 ? 'C6' : 'G5', type: 'square', dur: 0.025, gain: 0.04 * o.g, a: 0.001, hold: 0.015 }); },
    };

    function play(name, t, opts) {
      const fn = S[name];
      if (!fn) throw new Error('unknown sound: ' + name);
      const o2 = Object.assign({}, opts); o2.g = o2.gain == null ? 1 : o2.gain;
      if (opts && opts.minor) withMinor(() => fn(t, o2)); else fn(t, o2);
    }

    // everything scheduled inside fn counts as minor (quieter in voiceover mode)
    function withMinor(fn) { const was = inMinor; inMinor = true; try { fn(); } finally { inMinor = was; } }

    // ---- beds: continuous sound under a stretch of time. bed(name, t0, t1, opts)
    function bed(name, t0, t1, p) {
      if (VO) return;
      p = p || {}; const g = p.gain == null ? 1 : p.gain, d = t1 - t0, fade = Math.min(0.4, d / 4);
      const long = (q) => Object.assign({ dur: d, a: fade, hold: d - fade * 2, bus: 'amb' }, q);
      if (name === 'room') noise(t0, long({ color: 'brown', filter: 'lowpass', f: 320, gain: 0.12 * g }));
      else if (name === 'hiss') noise(t0, long({ color: 'pink', filter: 'highpass', f: 5000, gain: 0.02 * g }));
      else if (name === 'hum') { tone(t0, long({ f: 60, gain: 0.05 * g })); tone(t0, long({ f: 120, gain: 0.025 * g })); tone(t0, long({ f: 180, type: 'triangle', gain: 0.012 * g })); }
      else if (name === 'rain') { noise(t0, long({ color: 'pink', filter: 'bandpass', f: 2500, q: 0.4, gain: 0.08 * g })); const r = rand('rain'); for (let x = 0; x < d; x += 0.04 + r() * 0.08) noise(t0 + x, { dur: 0.01, filter: 'highpass', f: 4000, gain: 0.04 * g * r(), bus: 'amb', pan: r() * 1.6 - 0.8 }); }
      else if (name === 'projector') { noise(t0, long({ color: 'pink', filter: 'highpass', f: 3000, gain: 0.03 * g })); for (let x = 0; x < d; x += 1 / 24) S.tock(t0 + x, { f: 700, g: 0.04 * g, pan: 0.3 }); }
      else if (name === 'vinyl') { noise(t0, long({ color: 'pink', filter: 'bandpass', f: 1500, q: 0.5, gain: 0.025 * g })); const r = rand('vinyl'); for (let x = 0; x < d; x += 0.08 + r() * 0.4) noise(t0 + x, { dur: 0.006, filter: 'highpass', f: 2500, gain: 0.08 * g * r(), bus: 'amb' }); }
      else throw new Error('unknown bed: ' + name);
    }

    // ---- music: optional light beds that sit under the effects. music(name, t0, t1, { bpm, chords, gain })
    // chords: list of note arrays, one per bar, cycled. e.g. [['C4','E4','G4','B4'], ['A3','C4','E4','G4']]
    function music(name, t0, t1, p) {
      if (VO) return;
      p = p || {}; const g = p.gain == null ? 1 : p.gain, bpm = p.bpm || 100, beat = 60 / bpm, bar = beat * 4;
      const chords = p.chords || [['C4', 'E4', 'G4', 'B4'], ['A3', 'C4', 'E4', 'G4'], ['F3', 'A3', 'C4', 'E4'], ['G3', 'B3', 'D4', 'F4']];
      let i = 0;
      for (let t = t0; t < t1 - 0.05; t += bar, i++) {
        const ch = chords[i % chords.length], len = Math.min(bar, t1 - t);
        if (name === 'pad' || name === 'pulse') ch.forEach((n, k) => { tone(t, { f: n, type: 'triangle', dur: len + 0.3, gain: 0.035 * g, a: 0.25, hold: len - 0.3, bus: 'music', filter: 'lowpass', f2: 1400, pan: (k - 1.5) * 0.25, verb: 0.25 }); tone(t, { f: hz(n) * 1.004, type: 'sine', dur: len + 0.3, gain: 0.03 * g, a: 0.3, hold: len - 0.3, bus: 'music' }); });
        if (name === 'pulse') for (let b = 0; b < 4 && t + b * beat < t1 - 0.05; b++) {
          const tb = t + b * beat;
          tone(tb, { f: [[0, 110], [0.1, 50]], dur: 0.18, gain: (b % 2 ? 0.16 : 0.26) * g, bus: 'music' });
          noise(tb + beat / 2, { dur: 0.04, filter: 'highpass', f: 7000, gain: 0.05 * g, bus: 'music' });
          tone(tb + beat / 2, { f: hz(ch[0]) / 2, type: 'triangle', dur: beat * 0.45, gain: 0.08 * g, bus: 'music' });
        }
        if (name === 'chip') for (let s = 0; s < 8 && t + s * beat / 2 < t1 - 0.05; s++) {
          const ts = t + s * beat / 2;
          tone(ts, { f: hz(ch[0]) / 2, type: 'triangle', dur: beat * 0.45, gain: 0.12 * g, a: 0.001, hold: beat * 0.35, bus: 'music' });
          tone(ts, { f: ch[[0, 1, 2, 3, 2, 1, 2, 3][s]], type: 'square', dur: beat * 0.4, gain: 0.03 * g, a: 0.001, hold: beat * 0.25, bus: 'music' });
        }
      }
    }

    return { play, bed, music, tone, noise, withMinor, hz, vo: VO, sounds: Object.keys(S) };
  };

  // Live playback for a player: SOUND.live(scoreFn, fromT, { voiceover, master }) starts the score from explainer time
  // fromT right now and returns stop(). Call stop() on pause or seek, and SOUND.live again on play.
  SOUND.live = function (fn, fromT, opts) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    fn(SOUND.kit(ctx, Object.assign({}, opts, { start: fromT || 0, delay: 0.03 })));
    return () => { try { ctx.close(); } catch (e) {} };
  };

  // Render a style's explainerSound into an OfflineAudioContext; returns interleaved float stereo.
  SOUND.renderOffline = async function (fn, duration, sampleRate, kitOpts) {
    const sr = sampleRate || 48000, len = Math.ceil(duration * sr);
    const ctx = new OfflineAudioContext(2, len, sr);
    fn(SOUND.kit(ctx, kitOpts || {}));
    const buf = await ctx.startRendering();
    const L = buf.getChannelData(0), R = buf.getChannelData(1), inter = new Float32Array(len * 2);
    let peak = 0;
    for (let i = 0; i < len; i++) { inter[2 * i] = L[i]; inter[2 * i + 1] = R[i]; peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i])); }
    return { inter, peak, frames: len, sr };
  };
})();

function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
function smooth(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
