<script>(function(){var h=location.hostname;if(/github\.io$/.test(h)||h==="localhost"||h==="127.0.0.1"){document.getElementById("homeBtn").hidden=false;}})();</script>
<script>(function(){var h=location.hostname;if(!(/github\.io$/.test(h)||h==="localhost"||h==="127.0.0.1"))return;
var b=document.getElementById("updBtn");if(!b)return;b.hidden=false;
var m=document.querySelector('meta[name="app-ver"]'),cur=m?m.content:"";
function ask(){return fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){var v=String(j.v);try{localStorage.setItem("pipsVer",v);}catch(e){}return v;});}
function set(s,l){b.classList.remove("busy","ok","new","bad");if(s)b.classList.add(s);b.setAttribute("aria-label",l||"Check for updates");}
ask().then(function(v){if(v!==cur)b.classList.add("has");}).catch(function(){});
b.addEventListener("click",function(){if(b.classList.contains("busy"))return;set("busy","Checking for updates");
ask().then(function(v){if(v!==cur){set("new","Updating");setTimeout(function(){location.replace(location.pathname+"?v="+encodeURIComponent(v));},700);}else{b.classList.remove("has");set("ok","Up to date");setTimeout(function(){set("");},2500);}})
.catch(function(){set("bad","Could not check, no internet?");setTimeout(function(){set("");},2500);});});})();</script>
