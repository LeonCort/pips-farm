<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pips gård">
<meta name="theme-color" content="#a5bf66">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">

<title>Pips bondgård</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root { color-scheme: light; --paper: #fff6e4; --ink: #22303c; --ochre: #e0a646; --accent: #e9684a; --sea: #1f6a80; --line: #e2d2b4; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #f8dcc0; color: var(--ink); font-family: Fredoka, 'Trebuchet MS', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--sea); outline-offset: 3px; }
.scene { position: fixed; inset: 0; touch-action: none; }
.scene canvas { width: 100%; height: 100%; display: block; }
.vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(34,48,60,0) 60%, rgba(34,48,60,0.2) 100%); }
.coins { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 8px; padding: 6px 18px 6px 8px; border-radius: 999px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 4px 0 rgba(34,48,60,0.25); pointer-events: none; }
.coins svg { width: 40px; height: 40px; }
.coins span { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 1.5ch; }
.coins span.bump { animation: bump 0.25s ease-out; }
@keyframes bump { 50% { transform: scale(1.18); } }
.menuBtn { position: fixed; top: max(10px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--ink); background: var(--accent); box-shadow: 0 5px 0 rgba(34,48,60,0.3); padding: 10px; }
.menuBtn svg { width: 100%; height: 100%; display: block; }
.menuBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(34,48,60,0.3); }
.hint { position: fixed; left: 50%; bottom: max(70px, 12vh); width: 96px; height: 96px; margin-left: -48px; pointer-events: none; animation: tap 1.4s ease-in-out infinite; }
.hint svg { width: 100%; height: 100%; overflow: visible; }
.hint .ripple { transform-origin: 26px 18px; animation: ripple 1.4s ease-out infinite; }
@keyframes tap { 0%, 100% { transform: translate(0, 0); } 40% { transform: translate(-18px, -10px); } 70% { transform: translate(14px, -4px); } }
@keyframes ripple { 0% { opacity: 0.9; transform: scale(0.4); } 100% { opacity: 0; transform: scale(1.6); } }
.menu { position: fixed; inset: 0; background: rgba(34,48,60,0.35); display: flex; align-items: flex-end; justify-content: center; }
.menu[hidden] { display: none; }
.sheet { width: min(560px, 100%); box-sizing: border-box; background: var(--paper); border: 3px solid var(--ink); border-bottom: 0; border-radius: 28px 28px 0 0; padding: 14px max(16px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-bottom, 0px)); animation: up 0.22s ease-out; }
@keyframes up { from { transform: translateY(40%); opacity: 0; } }
.sheetTop { display: flex; justify-content: space-between; margin-bottom: 12px; }
.round { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--ink); background: #fffaf0; padding: 6px; }
.round svg { width: 100%; height: 100%; display: block; }
.round .mute { display: none; }
.round.off .mute { display: inline; } .round.off .wave { display: none; }
.ups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.up { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px 10px; border-radius: 22px; border: 3px solid var(--ink); background: #fffaf0; box-shadow: 0 5px 0 rgba(34,48,60,0.25); }
.up:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(34,48,60,0.25); }
.up svg { width: 72px; height: 72px; }
.dots { display: flex; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); border: 1.5px solid #cdb894; }
.dots i.on { background: #74a857; border-color: #3f7d62; }
.price { display: flex; align-items: center; gap: 6px; font-size: 24px; font-weight: 700; padding: 2px 14px; border-radius: 999px; background: var(--ochre); border: 2px solid var(--ink); }
.price i { width: 18px; height: 18px; border-radius: 50%; background: var(--ochre); border: 2px solid var(--ink); }
.up { position: relative; }
/* can buy: green price and a little wiggle so the child sees "press me" */
.up.can { background: #f2fae6; border-color: #3f7d62; }
.up.can .price { background: #74a857; color: #fff6e4; }
.up.can svg { animation: wiggle 1.6s ease-in-out infinite; }
@keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-8deg) scale(1.06); } 86% { transform: rotate(8deg) scale(1.06); } 94% { transform: rotate(-4deg); } }
/* cannot buy yet: grey, with a bar that fills as coins come in */
.up.poor svg { filter: grayscale(0.8); opacity: 0.6; }
.up.poor .price { background: var(--line); color: #7d6e5e; }
.need { display: none; width: 80%; height: 10px; border-radius: 999px; background: var(--line); border: 2px solid #cdb894; overflow: hidden; }
.need b { display: block; height: 100%; width: 0; background: var(--ochre); transition: width 0.3s; }
.up.poor .need { display: block; }
.up.maxed .price { background: #74a857; color: #fff6e4; }
.up.maxed .price i { display: none; }
.up.shake { animation: shake 0.4s; }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.up.got { animation: got 0.45s ease-out; }
@keyframes got { 40% { transform: scale(1.1); } }
.dots i.pop { animation: got 0.45s ease-out; }
.coins.no { animation: shake 0.4s; background: #f7c9bb; }
/* badge on the menu button when something can be bought */
.menuBtn .badge { position: absolute; top: -6px; right: -6px; width: 30px; height: 30px; border-radius: 50%; background: #74a857; border: 3px solid var(--ink); color: #fff6e4; font: 700 22px/24px Fredoka, sans-serif; text-align: center; display: none; }
.menuBtn.ready .badge { display: block; }
.menuBtn.ready { animation: ready 1.4s ease-in-out infinite; }
@keyframes ready { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
@media (prefers-reduced-motion: reduce) { .up.can svg, .menuBtn.ready, .up.shake, .up.got, .coins.no { animation: none; } }
.flycoin { position: fixed; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--ochre); border: 3px solid var(--ink); pointer-events: none; transition: transform 0.6s cubic-bezier(.5,-0.3,.7,1), opacity 0.6s ease-in; z-index: 5; }
.nogl { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 20px; }
@media (prefers-reduced-motion: reduce) { .hint, .hint .ripple { animation: none; } .sheet { animation: none; } }
.homeBtn { display: block; box-sizing: border-box; }
.sheetTop { gap: 12px; } .sheetTop .homeBtn { margin-right: auto; }
.ctrlBtn .tapI { display: none; } .ctrlBtn.tap .tapI { display: block; } .ctrlBtn.tap .drag { display: none; }
.joy { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 4px solid rgba(255,246,228,0.85); background: rgba(34,48,60,0.12); pointer-events: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(255,246,228,0.95); border: 3px solid var(--ink); }
[hidden] { display: none !important; }
.updBtn { position: relative; }
.updBtn .chk, .updBtn .bad { display: none; }
.updBtn.ok .arr, .updBtn.bad .arr { display: none; } .updBtn.ok .chk { display: inline; } .updBtn.bad .bad { display: inline; }
.updBtn.ok { background: #e3f4e0; border-color: #2f7d4f; } .updBtn.new { background: #e3f4e0; border-color: #2f7d4f; }
.updBtn.busy .arr, .updBtn.new .arr { transform-origin: 24px 24px; animation: updSpin 0.9s linear infinite; }
.updBtn .dot { display: none; position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid var(--ink); }
.updBtn.has .dot { display: block; } .updBtn.ok .dot { display: none; }
@keyframes updSpin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .updBtn.busy .arr, .updBtn.new .arr { animation-duration: 2.5s; } }
.ward { background: transparent; }
.ward .sheet { animation: none; padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.wardRows { display: flex; flex-direction: column; gap: 8px; }
.wrow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.sw { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--ink); background: #fffaf0; padding: 4px; display: grid; place-items: center; }
.sw i { display: block; width: 100%; height: 100%; border-radius: 50%; }
.sw svg { width: 100%; height: 100%; display: block; }
.sw.on { box-shadow: 0 0 0 4px var(--paper), 0 0 0 7px #2f7d4f; transform: scale(1.08); }
.sw:active { transform: scale(0.94); }
.wardDone { align-self: center; width: 84px; height: 64px; border-radius: 32px; border: 3px solid var(--ink); background: #3f9a62; box-shadow: 0 5px 0 rgba(34,48,60,0.3); padding: 8px; }
.wardDone svg { width: 100%; height: 100%; display: block; }
.wardDone:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(34,48,60,0.3); }
@media (orientation: landscape) { .ward { align-items: center; justify-content: flex-end; padding-right: max(16px, env(safe-area-inset-right, 0px)); } .sw { width: 46px; height: 46px; } .ward .sheet { width: min(480px, 54vw); border: 3px solid var(--ink); border-radius: 28px; margin-top: 60px; } }
@media (max-width: 480px) { .sw { width: 38px; height: 38px; padding: 3px; } .wrow { gap: 6px; } }
@media (max-height: 520px) { .sw { width: 31px; height: 31px; padding: 2px; border-width: 2px; } .wrow { gap: 5px; } .wardRows { gap: 4px; } .ward .sheet { margin-top: 0; max-height: none; padding-top: 8px; gap: 6px; } .wardDone { height: 48px; width: 72px; } }
.toast { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 10px 26px 10px 14px; border-radius: 999px; background: var(--paper); border: 4px solid var(--ink); box-shadow: 0 6px 0 rgba(34,48,60,0.3); font-size: 34px; pointer-events: none; }
.toast svg { width: 56px; height: 56px; }
.toast b { font-weight: 700; margin-right: 8px; }
.toast.show { animation: toastIn 3.2s ease-out forwards; }
@keyframes toastIn { 0% { opacity: 0; transform: translateX(-50%) scale(0.6); } 10% { opacity: 1; transform: translateX(-50%) scale(1.06); } 16% { transform: translateX(-50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast.show { animation: none; } }
.ups[hidden], .round[hidden] { display: none; }
.fpsBtn { position: relative; }
.fpsBtn b { position: absolute; left: 0; right: 0; bottom: 5px; font: 800 15px/1 system-ui, sans-serif; color: var(--ink); text-align: center; }
.fpsBtn.eco .leaf { stroke: #2f7d4f; transform: rotate(-50deg); transform-origin: 24px 30px; }

.flycoin { background: var(--accent); }
.price i { background: var(--accent); border-radius: 50% 50% 50% 50%; }
.acts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(18px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 14px; align-items: flex-end; }
.act { width: 96px; height: 96px; border-radius: 50%; border: 4px solid var(--ink); background: var(--paper); box-shadow: 0 6px 0 rgba(34,48,60,0.3); padding: 8px; animation: pop 0.25s ease-out; }
.act img { width: 100%; height: 100%; display: block; pointer-events: none; }
.act.ride { background: #f2fae6; border-color: #3f7d62; }
.act:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(34,48,60,0.3); }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .act { animation: none; } }

.clock { position: fixed; top: calc(max(12px, env(safe-area-inset-top, 0px)) + 62px); left: max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 2px; padding: 4px 8px; border-radius: 999px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 3px 0 rgba(34,48,60,0.2); pointer-events: none; }
.clock svg { width: 34px; height: 34px; display: block; }
.albumBtn { position: fixed; top: max(14px, env(safe-area-inset-top, 0px)); right: calc(max(16px, env(safe-area-inset-right, 0px)) + 90px); width: 68px; height: 68px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); box-shadow: 0 5px 0 rgba(34,48,60,0.3); padding: 8px; }
.albumBtn svg { width: 100%; height: 100%; display: block; }
.albumBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(34,48,60,0.3); }
.albumBtn .dot { display: none; position: absolute; top: -4px; right: -4px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid var(--ink); }
.albumBtn.new .dot { display: block; } .albumBtn.new { animation: ready 1.4s ease-in-out infinite; }
.album .sheet { width: min(760px, 100%); max-height: 86vh; display: flex; flex-direction: column; }
.albumCount { font-size: 26px; font-weight: 700; align-self: center; margin-right: auto; padding-left: 6px; }
.albumGrid { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 6px; }
.arow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 8px; border-radius: 20px; background: #f3e6cc; }
.stk { width: 84px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px 6px; border-radius: 16px; border: 3px dashed #c9b38c; background: #fbf3e2; }
.stk img { width: 72px; height: 72px; display: block; }
.stk span { width: 72px; height: 72px; display: grid; place-items: center; font-size: 34px; font-weight: 700; color: #c9b38c; }
.stk em { font-style: normal; font-size: 15px; font-weight: 600; min-height: 18px; text-align: center; }
.stk.got { border: 3px solid var(--ink); background: #fffaf0; box-shadow: 0 3px 0 rgba(34,48,60,0.2); }
.stk.baby.got { background: #fde8ee; }
@media (max-width: 480px) { .stk { width: 70px; } .stk img, .stk span { width: 60px; height: 60px; } .albumBtn { width: 60px; height: 60px; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 86px); } }
@media (prefers-reduced-motion: reduce) { .albumBtn.new { animation: none; } }
</style>
</head>
<body>

<div class="scene" id="scene" role="application" aria-label="The farm. Touch and hold where Pip should walk to fetch food and feed the animals. Arrow keys also work.">
  <canvas id="gl"></canvas>
  <span class="vig"></span>
</div>
<div class="coins" role="status" aria-label="Hearts">
    <svg id="coinIcon" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 40 C6 28 6 12 16 10 C20 9 23 12 24 15 C25 12 28 9 32 10 C42 12 42 28 24 40 Z" fill="#e9684a" stroke="#22303c" stroke-width="3" stroke-linejoin="round"/></svg>
  <span id="coins">0</span>
</div>
<button type="button" class="menuBtn" id="menuBtn" aria-label="Settings" aria-expanded="false"><span class="badge" aria-hidden="true">+</span>
  <svg viewBox="0 0 48 48" aria-hidden="true"><g fill="#fff6e4" stroke="#22303c" stroke-width="3" stroke-linejoin="round"><path d="M21 5 H27 L28 10 L32 12 L37 9 L41 13 L38 18 L40 22 L45 23 V29 L40 30 L38 34 L41 39 L37 43 L32 40 L28 42 L27 47 H21 L20 42 L16 40 L11 43 L7 39 L10 34 L8 30 L3 29 V23 L8 22 L10 18 L7 13 L11 9 L16 12 L20 10 Z" transform="translate(0,-2)"/></g><circle cx="24" cy="24" r="6" fill="#e9684a" stroke="#22303c" stroke-width="3"/></svg>
</button>
<div class="clock" id="clock" role="status"></div>
<div class="toast" id="toast" hidden aria-live="polite"></div>
<button type="button" class="albumBtn" id="albumBtn" aria-label="Sticker album"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="7" width="30" height="35" rx="4" fill="#3f7d62" stroke="#22303c" stroke-width="3"/><rect x="15" y="13" width="18" height="14" rx="3" fill="#fff6e4" stroke="#22303c" stroke-width="2.5"/><path d="M24 24 C17 19 18 15 21 15 C22.5 15 23.5 16 24 17 C24.5 16 25.5 15 27 15 C30 15 31 19 24 24 Z" fill="#e9684a"/><path d="M14 35 H34" stroke="#fff6e4" stroke-width="3" stroke-linecap="round"/></svg><span class="dot" aria-hidden="true"></span></button>
<div class="menu album" id="album" hidden>
  <div class="sheet" role="dialog" aria-label="Sticker album">
    <div class="sheetTop"><span class="albumCount" id="albumCount"></span><button type="button" class="round" id="albumClose" aria-label="Close"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 14 L34 34 M34 14 L14 34" stroke="#22303c" stroke-width="5" stroke-linecap="round"/></svg></button></div>
    <div class="albumGrid" id="albumGrid"></div>
  </div>
</div>
<div class="hint" id="hint" aria-hidden="true">
  <svg viewBox="0 0 64 64"><circle class="ripple" cx="26" cy="18" r="12" fill="none" stroke="#fff6e4" stroke-width="3"/><path d="M22 18 v22 l-6 -5 c-3 -2 -6 1 -4 4 l12 15 h18 c3 0 5 -3 5 -6 V32 c0 -3 -4 -4 -5 -1 v-3 c0 -3 -4 -4 -5 -1 v-2 c0 -3 -5 -3 -5 0 V18 c0 -4 -6 -4 -6 0 z" fill="#fff6e4" stroke="#22303c" stroke-width="2.5" stroke-linejoin="round"/></svg>
</div>
<div class="joy" id="joy" hidden aria-hidden="true"><i></i></div>
<div class="acts" id="acts"><button type="button" class="act" id="actB" hidden><img alt=""></button><button type="button" class="act" id="actA" hidden><img alt=""></button></div>
<div class="menu" id="menu" hidden>
  <div class="sheet" role="dialog" aria-label="Settings">
    <div class="sheetTop">
      <button type="button" class="round" id="soundBtn" aria-label="Sound" aria-pressed="true"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 19 h7 l9 -8 v26 l-9 -8 h-7 z" fill="#fff6e4" stroke="#22303c" stroke-width="3" stroke-linejoin="round"/><path class="wave" d="M31 17 q5 7 0 14 M35 13 q9 11 0 22" fill="none" stroke="#22303c" stroke-width="3" stroke-linecap="round"/><path class="mute" d="M31 18 l10 12 M41 18 l-10 12" stroke="#b8401f" stroke-width="3.5" stroke-linecap="round"/></svg></button>
      <button type="button" class="round" id="wardBtn" hidden aria-label="Change clothes and hair"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M17 8 L8 14 L11 23 L15 21 V40 H33 V21 L37 23 L40 14 L31 8 C29 12 19 12 17 8 Z" fill="#e9684a" stroke="#22303c" stroke-width="3" stroke-linejoin="round"/></svg></button>
      <button type="button" class="round ctrlBtn" id="ctrlBtn" aria-label="Steering"><svg class="drag" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="17" fill="none" stroke="#22303c" stroke-width="3" stroke-dasharray="4 4"/><circle cx="31" cy="18" r="8" fill="#e9684a" stroke="#22303c" stroke-width="3"/><path d="M24 24 L30 19" stroke="#22303c" stroke-width="3" stroke-linecap="round"/></svg><svg class="tapI" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="7" fill="#e9684a" stroke="#22303c" stroke-width="3"/><circle cx="24" cy="24" r="15" fill="none" stroke="#22303c" stroke-width="3"/><path d="M24 3 v5 M24 40 v5 M3 24 h5 M40 24 h5" stroke="#22303c" stroke-width="3" stroke-linecap="round"/></svg></button>
      <button type="button" class="round fpsBtn" id="fpsBtn" aria-label="Frame rate"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 33 A17 17 0 1 1 40 33" fill="#fff6e4" stroke="#22303c" stroke-width="3" stroke-linecap="round"/><path class="leaf" d="M24 30 L33 17" stroke="#e9684a" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="30" r="3.5" fill="#22303c"/></svg><b>30</b></button>

<script>
// Voiceover mode: SOUND.kit(ctx, { voiceover: true }) drops beds and music, plays anything marked minor
// (play(..., { minor: true }), tone/noise { minor: true }, or scheduled inside k.withMinor(() => ...)) at about 60%
// volume instead of full, and sits all effects a little lower, so the narration stays on top while the piece still
// sounds alive. In the full mix, minor sounds play at full volume. Scores can read k.vo to branch further.
// A style adds   explainerSound(k) { k.bed('room', 0, D); k.play('pop', 1.25); ... }   and the same
// call schedules into a live AudioContext (the player) or an OfflineAudioContext (the video render).
// Times are seconds on the explainer's own clock. Randomness is seeded, so every render is identical.
(function () {
  'use strict';
  const SOUND = (window.SOUND = {});
  const TINY = 1e-4;

  // seeded random in [0,1), keyed by any string
  function rand(key) {
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0 || 1;
    return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // note names to Hz: 'A4' = 440, 'C#5', 'Eb3'
  const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const semis = STEP[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) - 4) * 12 - 9;
    return 440 * Math.pow(2, semis / 12);
  }
  SOUND.hz = hz;

  SOUND.kit = function (ctx, opts) {
    const o = opts || {};
    const VO = !!o.voiceover;
    const MINOR = 0.6; // voiceover-mode volume for minor sounds
    let inMinor = false;
    const gainOf = (p, d) => (p.gain == null ? d : p.gain) * (VO && (p.minor || inMinor) ? MINOR : 1);
    const T0 = (o.start || 0) - 0; // explainer time that maps to ctx time `base`
    const base = ctx.currentTime + (o.delay || 0);
    // Start times snap to the sample grid (+ a quarter sample): in Chrome a source started a hair off the grid can
    // spike to about twice its set level.
    const SR = ctx.sampleRate;
    const at = (t) => (Math.round((base + (t - T0)) * SR) + 0.25) / SR;

    // ---- buses: sfx, amb, music -> compressor -> master; one shared reverb send
    const master = ctx.createGain(); master.gain.value = o.master == null ? 0.9 : o.master;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.18;
    comp.connect(master); master.connect(o.dest || ctx.destination);
    const bus = {};
    for (const [name, g] of Object.entries({ sfx: VO ? 0.7 : 0.85, amb: 0.5, music: 0.45 })) { bus[name] = ctx.createGain(); bus[name].gain.value = g; bus[name].connect(comp); }

    // generated room reverb: decaying stereo noise, darker toward the tail
    const verb = ctx.createConvolver();
    {
      const secs = 1.6, n = Math.floor(secs * ctx.sampleRate), ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const r = rand('verb' + c), d = ir.getChannelData(c); let lp = 0;
        for (let i = 0; i < n; i++) { const u = i / n; lp += (0.6 - 0.45 * u) * ((r() * 2 - 1) - lp); d[i] = lp * Math.pow(1 - u, 3); }
      }
      verb.buffer = ir;
    }
    const verbIn = ctx.createGain(); verbIn.gain.value = 0.9; verbIn.connect(verb); verb.connect(comp);

    // seeded noise buffers: white, pink-ish and brown
    const noiseBuf = {};
    {
      const n = Math.floor(2.5 * ctx.sampleRate);
      for (const kind of ['white', 'pink', 'brown']) {
        const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), r = rand('noise-' + kind);
        let p0 = 0, p1 = 0, p2 = 0, br = 0;
        for (let i = 0; i < n; i++) {
          const w = r() * 2 - 1;
          if (kind === 'white') d[i] = w;
          else if (kind === 'pink') { p0 = 0.997 * p0 + 0.029 * w; p1 = 0.985 * p1 + 0.032 * w; p2 = 0.95 * p2 + 0.048 * w; d[i] = (p0 + p1 + p2 + w * 0.05) * 2.2; }
          else { br = (br + 0.02 * w) / 1.02; d[i] = br * 3.2; }
        }
        noiseBuf[kind] = b;
      }
    }

    // ---- automation helpers
    // a value or [[dt, value], ...] from the voice start; ramps are exponential (frequencies)
    function sweep(param, v, t) {
      if (!Array.isArray(v)) { param.setValueAtTime(v, t); return; }
      param.setValueAtTime(v[0][1], t + v[0][0]);
      for (let i = 1; i < v.length; i++) param.exponentialRampToValueAtTime(Math.max(v[i][1], 1), t + v[i][0]);
    }
    // amplitude: linear attack to `gain`, optional hold, exponential release to silence by `dur`
    function shape(param, t, gain, dur, a, hold) {
      a = Math.min(a == null ? 0.004 : a, dur * 0.9);
      hold = Math.min(hold || 0, dur - a);
      param.setValueAtTime(0, t);
      param.linearRampToValueAtTime(gain, t + a);
      if (hold > 0) param.setValueAtTime(gain, t + a + hold);
      param.exponentialRampToValueAtTime(TINY, t + dur);
      param.setValueAtTime(0, t + dur + 0.001);
    }
    function out(node, p) {
      const pan = ctx.createStereoPanner(); pan.pan.value = Math.max(-1, Math.min(1, p.pan || 0));
      node.connect(pan); pan.connect(bus[p.bus || 'sfx']);
      if (p.verb) { const s = ctx.createGain(); s.gain.value = p.verb; pan.connect(s); s.connect(verbIn); }
    }
    function filterNode(p, t) {
      if (!p.filter) return null;
      const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 1 : p.q;
      sweep(f.frequency, p.f == null ? 1000 : p.f, t);
      return f;
    }

    // Live playback from the middle of a piece: a long sound (a bed, a pad) that began before that point has a start
    // time in the past, which Web Audio refuses. Pick it up now, at its held level, for the time it has left.
    function late(t, dur, p) {
      if (t >= ctx.currentTime) return null;   // never true in an offline render, so rendered sound is unchanged
      const now = ctx.currentTime + 0.01;
      const cut = now - t, left = dur - cut;
      if (left < 0.08) return { skip: true };
      const a = Math.min(0.05, left / 2);
      return { t: now, dur: left, p: Object.assign({}, p, { a, hold: Math.max(0, Math.min(left - a - 0.02, (p.a == null ? 0.004 : p.a) + (p.hold || 0) - cut)) }) };
    }

    // ---- primitives
    // tone(t, { f, type, dur, gain, a, hold, pan, verb, bus, filter, f2 (filter freq), q, detune })
    function tone(time, p) {
      let t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const lt = late(t, dur, p); if (lt) { if (lt.skip) return; t = lt.t; dur = lt.dur; p = lt.p; }
      const osc = ctx.createOscillator(); osc.type = p.type || 'sine';
      sweep(osc.frequency, Array.isArray(p.f) ? p.f.map(([d, v]) => [d, hz(v)]) : hz(p.f || 440), t);
      if (p.detune) osc.detune.value = p.detune;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      let node = osc;
      if (p.filter) { const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 0.8 : p.q; sweep(f.frequency, p.f2 || 2000, t); osc.connect(f); node = f; }
      node.connect(g); out(g, p);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
    // noise(t, { dur, color, filter, f, q, gain, a, hold, pan, verb, bus, rate })
    function noise(time, p) {
      let t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const lt = late(t, dur, p); if (lt) { if (lt.skip) return; t = lt.t; dur = lt.dur; p = lt.p; }
      const src = ctx.createBufferSource(); src.buffer = noiseBuf[p.color || 'white']; src.loop = true;
      if (p.rate) src.playbackRate.value = p.rate;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      const f = filterNode(p, t);
      if (f) { src.connect(f); f.connect(g); } else src.connect(g);
      out(g, p);
      const off = rand('off' + time + (p.f || ''))() * 2;
      src.start(t, off); src.stop(t + dur + 0.02);
    }

    // ---- named sounds. play(name, t, opts): opts.gain scales the whole sound, opts.pan places it.
    const S = {
      // UI / motion graphics
      pop: (t, o) => { tone(t, { f: [[0, o.f || 620], [0.07, (o.f || 620) * 0.45]], dur: 0.1, gain: 0.32 * o.g, pan: o.pan }); noise(t, { dur: 0.012, filter: 'highpass', f: 3000, gain: 0.12 * o.g, pan: o.pan }); },
      tick: (t, o) => noise(t, { dur: 0.018, filter: 'bandpass', f: o.f || 4200, q: 2.5, gain: 0.3 * o.g, pan: o.pan }),
      click: (t, o) => { tone(t, { f: o.f || 1900, type: 'square', dur: 0.02, gain: 0.08 * o.g, filter: 'lowpass', f2: 3000, pan: o.pan }); noise(t, { dur: 0.01, filter: 'highpass', f: 2500, gain: 0.15 * o.g, pan: o.pan }); },
      tock: (t, o) => { tone(t, { f: o.f || 820, dur: 0.07, gain: 0.25 * o.g, pan: o.pan }); noise(t, { dur: 0.05, filter: 'bandpass', f: o.f || 820, q: 9, gain: 0.35 * o.g, pan: o.pan }); },
      blip: (t, o) => tone(t, { f: o.f || 'E6', type: o.type || 'square', dur: o.dur || 0.07, gain: 0.07 * o.g, a: 0.002, hold: (o.dur || 0.07) * 0.6, pan: o.pan }),
      whoosh: (t, o) => { const d = o.dur || 0.45; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 350], [d * 0.55, o.top || 2600], [d, 700]], q: 0.9, gain: 0.32 * o.g, a: d * 0.5, pan: o.pan, verb: 0.15 }); },
      swish: (t, o) => { const d = o.dur || 0.18; noise(t, { dur: d, filter: 'highpass', f: [[0, 1800], [d, 5200]], q: 0.7, gain: 0.22 * o.g, a: d * 0.35, pan: o.pan }); },
      riser: (t, o) => { const d = o.dur || 0.8; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 300], [d, 4000]], q: 1.2, gain: 0.25 * o.g, a: d * 0.95, pan: o.pan, verb: 0.2 }); tone(t, { f: [[0, 180], [d, 720]], type: 'triangle', dur: d, gain: 0.06 * o.g, a: d * 0.9 }); },
      thud: (t, o) => { tone(t, { f: [[0, o.f || 130], [0.16, 42]], dur: 0.26, gain: 0.55 * o.g, pan: o.pan }); noise(t, { dur: 0.09, color: 'brown', filter: 'lowpass', f: 500, gain: 0.35 * o.g, pan: o.pan }); },
      impact: (t, o) => { S.thud(t, o); noise(t, { dur: 0.7, color: 'pink', filter: 'lowpass', f: [[0, 2400], [0.6, 300]], gain: 0.3 * o.g, verb: 0.35, pan: o.pan }); },
      stamp: (t, o) => { S.thud(t, { ...o, f: 160 }); noise(t, { dur: 0.05, filter: 'bandpass', f: 1300, q: 1.2, gain: 0.4 * o.g, pan: o.pan }); noise(t + 0.004, { dur: 0.012, filter: 'highpass', f: 3500, gain: 0.25 * o.g, pan: o.pan }); },
      ding: (t, o) => { const f = hz(o.f || 'E6'); tone(t, { f, dur: 1.3, gain: 0.2 * o.g, verb: 0.3, pan: o.pan }); tone(t, { f: f * 2.76, dur: 0.5, gain: 0.05 * o.g, verb: 0.3, pan: o.pan }); },
      success: (t, o) => { S.ding(t, { ...o, f: o.f || 'C6' }); S.ding(t + 0.09, { ...o, f: hz(o.f || 'C6') * 1.5, g: o.g * 0.9 }); },
      error: (t, o) => { tone(t, { f: o.f || 'A3', type: 'square', dur: 0.13, gain: 0.09 * o.g, hold: 0.08, filter: 'lowpass', f2: 1400, pan: o.pan }); tone(t + 0.15, { f: hz(o.f || 'A3') * 0.8, type: 'square', dur: 0.22, gain: 0.09 * o.g, hold: 0.14, filter: 'lowpass', f2: 1200, pan: o.pan }); },
      buzz: (t, o) => { const d = o.dur || 0.3; tone(t, { f: o.f || 110, type: 'sawtooth', dur: d, gain: 0.12 * o.g, hold: d * 0.7, filter: 'lowpass', f2: 900, pan: o.pan }); tone(t, { f: (o.f || 110) * 1.01, type: 'sawtooth', dur: d, gain: 0.1 * o.g, hold: d * 0.7, filter: 'lowpass', f2: 900, pan: o.pan }); },
      sparkle: (t, o) => { const r = rand('sparkle' + t), notes = ['C6', 'D6', 'E6', 'G6', 'A6', 'C7']; for (let i = 0; i < (o.n || 6); i++) { const ti = t + i * 0.04 + r() * 0.01, f = hz(notes[Math.floor(r() * notes.length)]), pan = r() * 1.2 - 0.6; tone(ti, { f, dur: 0.6, gain: 0.04 * o.g, a: 0.002, verb: 0.35, pan }); tone(ti, { f: f * 2.76, dur: 0.2, gain: 0.012 * o.g, a: 0.002, pan }); } },
      glitch: (t, o) => { const r = rand('glitch' + t); for (let i = 0; i < 7; i++) tone(t + i * 0.022, { f: 200 + r() * 1800, type: 'square', dur: 0.02, gain: 0.07 * o.g, a: 0.001, hold: 0.015, pan: r() * 1.4 - 0.7 }); noise(t, { dur: 0.16, filter: 'bandpass', f: 2500, q: 0.6, gain: 0.12 * o.g }); },
      shutter: (t, o) => { S.click(t, o); noise(t + 0.06, { dur: 0.04, filter: 'bandpass', f: 2200, q: 1, gain: 0.2 * o.g, pan: o.pan }); },
      count: (t, o) => S.tick(t, { ...o, f: o.f || 5200, g: o.g * 0.7 }),

      // hand-made media
      // stroke: a pen/marker/chalk/pencil stroke over `dur` seconds. material sets the surface sound.
      stroke: (t, o) => {
        const d = o.dur || 0.4, m = o.material || 'marker', r = rand('stroke' + m + t);
        const M = {
          marker: { f: 2900, q: 2.2, g: 0.16, grain: 0.05 },
          chalk: { f: 1700, q: 0.6, g: 0.22, grain: 0.028 },
          pencil: { f: 4600, q: 0.8, g: 0.16, grain: 0.04, filter: 'highpass' },
          pen: { f: 4200, q: 1.6, g: 0.08, grain: 0.06 },
          brush: { f: 900, q: 0.5, g: 0.1, grain: 0.09, color: 'pink' },
          sharpie: { f: 2400, q: 1.4, g: 0.2, grain: 0.045 },
        }[m];
        for (let x = 0; x < d; x += M.grain * (0.7 + r() * 0.6)) {
          const gd = M.grain * (0.8 + r() * 0.9);
          noise(t + x, { dur: gd, color: M.color, filter: M.filter || 'bandpass', f: M.f * (0.8 + r() * 0.4), q: M.q, gain: M.g * o.g * (0.6 + r() * 0.5), a: gd * 0.3, pan: (o.pan || 0) + (r() - 0.5) * 0.2 });
        }
      },
